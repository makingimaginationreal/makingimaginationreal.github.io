<style>
  /* ===== CSS: 화면 꾸미기 ===== */
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at center, #0c2a3c 0%, #04101a 70%);
  }
  body {
    flex-direction: column;
    gap: 10px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* ===== 고대 그리스 도자기 장식 (테라코타 주황 + 검정) =====
     테두리: 메안드로스(그리스 키) 무늬 띠, 모서리는 아테네 적색상 도자기의 X자 사각형
     조작판: 흑색상 도자기의 점 무늬 테두리 원반, 조이스틱 받침은 항아리 밑동의 '혀 무늬' */
  #frame {
    border: 18px solid #1b100b;
    border-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 60 60%22%3E%3Cg transform=%22translate(0 0)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Crect x=%223%22 y=%223%22 width=%2214%22 height=%2214%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222%22/%3E%3Cpath d=%22M3 3L17 17M17 3L3 17%22 stroke=%22%231b100b%22 stroke-width=%221.8%22/%3E%3C/g%3E%3Cg transform=%22translate(40 0)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Crect x=%223%22 y=%223%22 width=%2214%22 height=%2214%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222%22/%3E%3Cpath d=%22M3 3L17 17M17 3L3 17%22 stroke=%22%231b100b%22 stroke-width=%221.8%22/%3E%3C/g%3E%3Cg transform=%22translate(0 40)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Crect x=%223%22 y=%223%22 width=%2214%22 height=%2214%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222%22/%3E%3Cpath d=%22M3 3L17 17M17 3L3 17%22 stroke=%22%231b100b%22 stroke-width=%221.8%22/%3E%3C/g%3E%3Cg transform=%22translate(40 40)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Crect x=%223%22 y=%223%22 width=%2214%22 height=%2214%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222%22/%3E%3Cpath d=%22M3 3L17 17M17 3L3 17%22 stroke=%22%231b100b%22 stroke-width=%221.8%22/%3E%3C/g%3E%3Cg transform=%22translate(30 10) rotate(0) translate(-10 -10)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Cpath d=%22M0 17.5H20M3 17.5V3H17V13H8V8H12.5%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222.4%22 stroke-linecap=%22square%22/%3E%3C/g%3E%3Cg transform=%22translate(30 50) rotate(180) translate(-10 -10)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Cpath d=%22M0 17.5H20M3 17.5V3H17V13H8V8H12.5%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222.4%22 stroke-linecap=%22square%22/%3E%3C/g%3E%3Cg transform=%22translate(10 30) rotate(-90) translate(-10 -10)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Cpath d=%22M0 17.5H20M3 17.5V3H17V13H8V8H12.5%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222.4%22 stroke-linecap=%22square%22/%3E%3C/g%3E%3Cg transform=%22translate(50 30) rotate(90) translate(-10 -10)%22%3E%3Crect width=%2220%22 height=%2220%22 fill=%22%23c4693a%22/%3E%3Cpath d=%22M0 17.5H20M3 17.5V3H17V13H8V8H12.5%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%222.4%22 stroke-linecap=%22square%22/%3E%3C/g%3E%3C/svg%3E") 20 round;
    background: #1b100b;
    box-shadow: 0 0 0 2px #1b100b, 0 0 0 4px #c4693a, 0 0 0 6px #1b100b,
                0 20px 60px rgba(0, 0, 0, 0.6);
    line-height: 0;
  }
  canvas {
    height: min(calc(94vh - 48px), 912px, calc((100vw - 64px) * 4 / 3));
    touch-action: manipulation;
    width: auto;
    aspect-ratio: 3 / 4;
    display: block;
    background: #06233a;
  }
  /* ===== 터치 조작판 (휴대폰·태블릿에서만 보인다) ===== */
  #pad { display: none; }
  body.touch #frame { border-width: 12px; box-shadow: 0 0 0 2px #1b100b, 0 0 0 3px #c4693a, 0 10px 30px rgba(0, 0, 0, 0.5); }
  body.touch canvas { height: min(calc(100vh - 150px), 912px, calc((100vw - 46px) * 4 / 3)); }
  body.touch #pad {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(calc(100vw - 16px), 520px);
    height: 90px;
    touch-action: none;
  }
  #stick {
    position: relative;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2249%22 fill=%22%23c4693a%22 stroke=%22%231b100b%22 stroke-width=%222%22/%3E%3Cpath d=%22M80.00 50.00 L95.67 44.49 A46 46 0 0 1 95.67 55.51Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M78.98 57.76 L95.54 56.50 A46 46 0 0 1 92.69 67.14Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M75.98 65.00 L92.30 68.07 A46 46 0 0 1 86.80 77.60Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M71.21 71.21 L86.19 78.40 A46 46 0 0 1 78.40 86.19Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M65.00 75.98 L77.60 86.80 A46 46 0 0 1 68.07 92.30Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M57.76 78.98 L67.14 92.69 A46 46 0 0 1 56.50 95.54Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M50.00 80.00 L55.51 95.67 A46 46 0 0 1 44.49 95.67Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M42.24 78.98 L43.50 95.54 A46 46 0 0 1 32.86 92.69Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M35.00 75.98 L31.93 92.30 A46 46 0 0 1 22.40 86.80Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M28.79 71.21 L21.60 86.19 A46 46 0 0 1 13.81 78.40Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M24.02 65.00 L13.20 77.60 A46 46 0 0 1 7.70 68.07Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M21.02 57.76 L7.31 67.14 A46 46 0 0 1 4.46 56.50Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M20.00 50.00 L4.33 55.51 A46 46 0 0 1 4.33 44.49Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M21.02 42.24 L4.46 43.50 A46 46 0 0 1 7.31 32.86Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M24.02 35.00 L7.70 31.93 A46 46 0 0 1 13.20 22.40Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M28.79 28.79 L13.81 21.60 A46 46 0 0 1 21.60 13.81Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M35.00 24.02 L22.40 13.20 A46 46 0 0 1 31.93 7.70Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M42.24 21.02 L32.86 7.31 A46 46 0 0 1 43.50 4.46Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M50.00 20.00 L44.49 4.33 A46 46 0 0 1 55.51 4.33Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M57.76 21.02 L56.50 4.46 A46 46 0 0 1 67.14 7.31Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M65.00 24.02 L68.07 7.70 A46 46 0 0 1 77.60 13.20Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M71.21 28.79 L78.40 13.81 A46 46 0 0 1 86.19 21.60Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M75.98 35.00 L86.80 22.40 A46 46 0 0 1 92.30 31.93Z%22 fill=%22%231b100b%22/%3E%3Cpath d=%22M78.98 42.24 L92.69 32.86 A46 46 0 0 1 95.54 43.50Z%22 fill=%22%231b100b%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2228%22 fill=%22%23c4693a%22 stroke=%22%231b100b%22 stroke-width=%221.5%22/%3E%3C/svg%3E") center / 100% 100% no-repeat;
    touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 36px; height: 36px; margin: -18px 0 0 -18px;
    box-sizing: border-box;                    /* 테두리까지 36px 안에 — 받침 정중앙에 오도록 */
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f0c987, #b07a35 60%, #6e4618);   /* 청동 방패 손잡이 */
    border: 2px solid #1b100b;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .btns { display: flex; gap: 10px; align-items: center; }
  .btns button {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2249%22 fill=%22%231b100b%22/%3E%3Ccircle cx=%2294.00%22 cy=%2250.00%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2290.65%22 cy=%2266.84%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2281.11%22 cy=%2281.11%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2266.84%22 cy=%2290.65%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2250.00%22 cy=%2294.00%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2233.16%22 cy=%2290.65%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2218.89%22 cy=%2281.11%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%229.35%22 cy=%2266.84%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%226.00%22 cy=%2250.00%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%229.35%22 cy=%2233.16%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2218.89%22 cy=%2218.89%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2233.16%22 cy=%229.35%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2250.00%22 cy=%226.00%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2266.84%22 cy=%229.35%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2281.11%22 cy=%2218.89%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2290.65%22 cy=%2233.16%22 r=%222.3%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2237%22 fill=%22%23c4693a%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2233%22 fill=%22none%22 stroke=%22%231b100b%22 stroke-width=%221.5%22/%3E%3C/svg%3E") center / 100% 100% no-repeat;
    color: #1b100b;
    font: 900 10.5px "Noto Sans KR", sans-serif;
    letter-spacing: -0.8px;
    touch-action: none;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
  }
  .btns button.on { filter: brightness(1.25) drop-shadow(0 0 6px rgba(240, 160, 90, 0.8)); transform: scale(0.95); }
  #bPause { width: 34px; height: 34px; font: 900 10px "Cinzel", serif; }
</style>
</head>
<body>

<div id="frame"><canvas id="game" width="480" height="640"></canvas></div>

<!-- 터치 조작판: 왼쪽 조이스틱(항해), 오른쪽 버튼(일시정지·부스터·불화살) -->
<div id="pad">
  <div id="stick"><div id="knob"></div></div>
  <div class="btns">
    <button id="bPause">II</button>
    <button id="bBoost">부스터</button>
    <button id="bFire">불화살</button>
  </div>
</div>

<script>
// =====================================================
//  ODYSSEUS — 오디세우스: 귀향의 항해  (마크 2)
//  트로이 전쟁이 끝났다. 신들의 시련이 기다리는 아홉 바다를 건너
//  고향 이타카로 돌아가라!
//
//  구성: ① 설정값 → ② 준비 → ③ 키보드 → ④ 게임 시작
//        → ⑤ 계산(update) → ⑥ 그리기(draw) → ⑦ 반복
// =====================================================


// ① 설정값 — 여기 숫자만 바꿔도 게임이 달라집니다
const SETTINGS = {
  // ★ 난이도 한눈에 조절 — 숫자가 작을수록 쉬워진다
  damageScale: 0.8,        // 모든 피해에 곱해지는 값 (0.8 = 원래 피해의 80%)
  hazardScale: 0.85,        // 위험(바위·창·음식·망령선·촉수·벼락 등)이 나오는 빈도
  invincibleTime: 80,     // 맞은 뒤 무적 시간 (60 = 1초)

  sailSpeed: 1.3,          // 바다가 흘러가는 속도 (= 배가 앞으로 나아가는 속도)
  introTime: 10,           // 해역마다 시작 전에 중요 규칙을 보여 주는 시간 (초) — 이 동안은 위험이 나오지 않는다
  stageLength: 6240,       // 해역 하나의 길이 (약 80초 — 컴퓨터·휴대폰 모두) — 이타카의 섬은 길이 대신 도끼 12개로 끝난다
  rampUp: 1.0,             // 다음 해역에 가까워질수록 어려워지는 정도 (1.0 = 끝에 가면 위험이 2배)
  rampSpeed: 0.28,         // 다음 해역에 가까워질수록 날아오는 것들이 빨라지는 정도 (0.28 = 끝에 가면 1.28배)
  giantHp: 3,              // 거인을 쓰러뜨리려면 맞혀야 하는 불화살 수
  spearSpeed: 4.2,         // 거인이 던지는 창의 속도
  spearDamage: 20,         // 창에 맞으면 줄어드는 선체
  foodSpeed: 3.2,          // 키르케가 던지는 음식의 속도
  ghostChargeSpeed: 5.2,   // 저승의 망령선이 돌진하는 속도
  ghostChargeDamage: 24,   // 돌진에 부딪히면 줄어드는 선체
  ghostChargeTurn: 0.02,   // 돌진하며 우리 배를 쫓아 방향을 트는 정도 (클수록 날쌔게 따라옴)
  songLength: 600,         // 세이렌의 노래가 이어지는 시간 (60 = 1초, 600 = 10초) — 이 동안 방향키가 뒤섞인다
  songPrelude: 60,         // 노래가 시작되기 전 예고(전주) 시간
  songGapMin: 300,         // 노래와 노래 사이 쉬는 시간 (최소~최대)
  songGapMax: 540,
  tentacleReach: 150,      // 스킬라 촉수가 뻗을 수 있는 최대 길이 (이보다 멀리 있으면 닿지 않는다)
  tentacleDamage: 22,      // 촉수에 내리찍히면 줄어드는 선체
  whirlDrain: 0.11,        // 소용돌이 안에서 1/60초마다 줄어드는 선체 (한가운데에서는 2배)
  whirlPull: 0.75,         // 소용돌이가 가운데로 빨아들이는 힘 — 노 젓는 힘(accel 0.6)보다 세서 부스터 없이는 못 빠져나온다
  axeCount: 12,            // 이타카의 섬: 이만큼 도끼를 불화살로 맞혀야 이타카에 닿는다
  suitorHp: 3,             // 청혼자의 배를 가라앉히려면 맞혀야 하는 불화살 수
  suitorArrowSpeed: 5.2,   // 청혼자들이 쏘는 불화살 속도
  suitorArrowDamage: 14,   // 청혼자의 불화살에 맞으면 줄어드는 선체
  suitorFireDelay: 95,     // 청혼자가 불화살을 쏘는 간격 (60 = 1초)
  typhoonSpeed: 3.4,       // 칼립소의 태풍이 날아오는 속도
  typhoonTurn: 0.022,      // 태풍이 우리 배를 쫓아 방향을 트는 정도 (지나치기 전까지)
  zapSpeed: 6.0,           // 태양신의 섬: 사방에서 날아오는 벼락의 속도
  zapDamage: 18,
  zapBounces: 4,           // 벼락이 암석·섬에 부딪혀 튕길 수 있는 최대 횟수 (그 뒤엔 그대로 지나간다)
  zapBounciness: 1.0,      // 튕길 때 속도 유지 비율 (1 = 탱탱볼처럼 그대로, 작을수록 느려짐)           // 날아오는 벼락에 맞으면 줄어드는 선체
  touchGameSpeed: 0.75,    // 터치 화면(휴대폰)에서 게임 전체 속도 — 배·바위·창·음식·벼락·태풍·촉수·불화살 모두 (컴퓨터의 0.75배)
  touchSpeed: 1.0,         // 터치 화면에서 배만 따로 더 느리게 하고 싶을 때 (1 = 게임 전체 속도를 그대로 따름)
  accel: 0.6,              // 노 젓는 힘
  drag: 0.87,              // 물의 저항 (1에 가까울수록 미끄러지듯 오래 감)
  arrowSpeed: 9,           // 불화살 속도
  shootDelay: 260,         // 불화살 쏘는 간격 (1000 = 1초) — 불화살은 Z 키
  turnSpeed: 0.13,         // 뱃머리가 도는 빠르기 (클수록 휙휙 돈다)
  boostPower: 2.4,         // 부스터(스페이스)를 쓰면 노 젓는 힘이 몇 배가 되는지
  boostDrain: 1.1,         // 부스터를 쓰는 동안 1/60초마다 줄어드는 게이지 (100이면 약 1.5초)
  boostRecharge: 0.55,     // 부스터를 안 쓸 때 1/60초마다 차오르는 게이지

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function shuffleArrows() {
  let order;
  do {
    order = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } while (order.every((v, i) => v === i));
  const map = {};
  ARROWS.forEach((k, i) => { map[k] = DIRS[order[i]]; });
  return map;
}

    return;                                                // 컴퓨터는 지금처럼 키보드로

(function setupPad() {
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  let stickId = null;
  function setDir(dx, dy) {
    const R = 30, len = Math.hypot(dx, dy);
    const k = len > R ? R / len : 1;
    knob.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
    const on = len > 9;                                   // 가운데 살짝 누른 건 무시
    const nx = on ? dx / len : 0, ny = on ? dy / len : 0;  // 8방향: 기울인 방향의 성분으로 방향키를 누른다
    keys['ArrowRight'] = nx > 0.38;
    keys['ArrowLeft'] = nx < -0.38;
    keys['ArrowDown'] = ny > 0.38;
    keys['ArrowUp'] = ny < -0.38;
  }
  function moveStick(e) {
    const r = stick.getBoundingClientRect();
    setDir(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  }
  stick.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    stickId = e.pointerId;
    try { stick.setPointerCapture(e.pointerId); } catch (err) {}
    moveStick(e);
  });
  stick.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) moveStick(e); });
  function releaseStick(e) {
    if (e.pointerId !== stickId) return;
    stickId = null;
    setDir(0, 0);
  }
  stick.addEventListener('pointerup', releaseStick);
  stick.addEventListener('pointercancel', releaseStick);

  function holdButton(id, code) {                          // 누르고 있는 동안 키를 누른 것처럼
    const b = document.getElementById(id);
    const down = function (e) { e.preventDefault(); keys[code] = true; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (err) {} };
    const up = function () { keys[code] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  holdButton('bBoost', 'Space');
  holdButton('bFire', 'KeyZ');
  document.getElementById('bPause').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  });
})();

    hiddenAt = Date.now();

  player = { x: W / 2, y: H - 110, vx: 0, vy: 0, hull: SETTINGS.hull, tilt: 0, oar: 0, heading: 0 };
  arrows = []; obstacles = []; missiles = []; tentacles = []; whirls = []; sirens = [];
  horses = []; potions = []; ghosts = []; ghostFire = []; bolts = []; typhoons = [];
  axes = []; suitors = []; suitorArrows = []; axesHit = 0;
  particles = []; rings = []; popups = [];
  stage = fromStage;
  if (fromStage === 0) stageStartScore = 0;
  score = stageStartScore;                                // 쉬운 버전에서 이어 하면 그 해역에 들어올 때의 점수로
  stageDist = 0;
  invincible = 0;
  poisoned = false;
  poisonStack = 0;
  boost = 100;
  boosting = false;
  startIntro();
  bannerNote = '';
  giantTimer = 0;
  windX = 0; windTarget = 0; windTimer = 240;
  song = { phase: 'quiet', t: SETTINGS.songGapMin, map: null };
  inSiren = false;
  arriving = false;
  ithacaY = -320;
  state = 'playing';
}

function endGame(newState) {
  state = newState;
  recordHighScore();
}

function stageLength(i) {
  // 휴대폰은 게임이 느리게 흐르는 만큼 해역을 짧게 잡아서, 실제 시간은 컴퓨터와 같은 약 65초가 되게 한다
  return SETTINGS.stageLength * (STAGES[i].length || 1) * (isTouch ? SETTINGS.touchGameSpeed : 1);
}

// 이타카까지 얼마나 왔나 (0 = 출발, 1 = 이타카)
function progress() {
  let total = 0, done = 0;
  for (let i = 0; i < STAGES.length; i++) {
    const len = stageLength(i);
    total += len;
    if (i < stage) done += len;
  }
  return Math.min(1, (done + stageFrac() * stageLength(stage)) / total);
}

// 배가 다쳤을 때
function hurt(amount) {
  if (invincible > 0) return false;
  player.hull -= Math.round(amount * SETTINGS.damageScale);
  invincible = SETTINGS.invincibleTime;
  shake = 10;
  redFlash = 18;
  woodBurst(player.x, player.y, 1.4);
  if (player.hull <= 0) shipwreck();
  return true;
}

function shipwreck() {
  player.hull = 0;
  woodBurst(player.x, player.y, 3);
  splash(player.x, player.y, 40);
  endGame('gameover');
}

// 태풍에 휩쓸림 → 점수도 잃고 첫 해역으로
function blowBack() {
  recordHighScore();
  state = 'blown';
  blownTimer = 150;
  shake = 16;
  splash(player.x, player.y, 50);
}

// --- 효과 만들기 ---
function particle(x, y, vx, vy, size, life, color, kind) {
  particles.push({ x, y, vx, vy, size, t: 0, life, color, kind });
}

function splash(x, y, size) {
  rings.push({ x, y, t: 0, life: 32, r: size, color: 'rgba(220, 245, 255, 0.8)' });
  rings.push({ x, y, t: -6, life: 32, r: size * 0.6, color: 'rgba(220, 245, 255, 0.6)' });
  for (let i = 0; i < 14; i++) {
    const a = rand(0, TAU), s = rand(0.8, 3.2);
    particle(x, y, Math.cos(a) * s, Math.sin(a) * s + SETTINGS.sailSpeed * 0.5, rand(1.2, 2.8), 30, pick(['#e8f7ff', '#9fd8ef', '#ffffff']), 'drop');
  }
}

function woodBurst(x, y, power) {
  for (let i = 0; i < 8 * power; i++) {
    const a = rand(0, TAU), s = rand(0.6, 2.6);
    particle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(1.5, 3.5), 40, pick(['#8b5a2b', '#a8743f', '#5a3a22']), 'chip');
  }
  for (let i = 0; i < 10 * power; i++) {
    const a = rand(0, TAU), s = rand(2, 4.5);
    particle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.8, 1.8), 22, '#ffcf70', 'spark');
  }
  rings.push({ x, y, t: 0, life: 20, r: 22 * power, color: 'rgba(255, 190, 110, 0.8)', fire: true });
}

function popup(x, y, text, color) {
  popups.push({ x, y, text, color: color || '#ffe7a3', t: 0 });
}


// --- 장애물과 위험 만들기 ---
function makeShape(n, lo, hi) {
  const s = [];
  for (let i = 0; i < n; i++) s.push(rand(lo, hi));
  return s;
}

function makeRock(x, y, r) {
  return { kind: 'rock', x, y, r, shape: makeShape(10, 0.75, 1.05), phase: rand(0, TAU),
           algae: [{ x: rand(-0.4, 0.4), y: rand(-0.4, 0.4) }, { x: rand(-0.4, 0.4), y: rand(-0.4, 0.4) }] };
}

function makeIsle(x, y, r) {
  const trees = [];
  const n = Math.max(2, Math.floor(r / 12));
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = rand(0, r * 0.45);
    trees.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, s: rand(0.8, 1.2) });
  }
  return { kind: 'isle', x, y, r, shape: makeShape(12, 0.85, 1.0), phase: rand(0, TAU), trees,
           hill: { x: rand(-0.2, 0.2), y: rand(-0.2, 0.2) }, cliff: r > 60 };
}

// 날아오는 것들 (바위·창·음식): 던지는 순간 배가 있던 곳을 향해 "일직선"으로 날아간다.
// 날아가는 도중에 배를 따라 방향을 바꾸지 않는다.
function launch(type, x, y, speed, extra) {
  const dx = player.x - x, dy = player.y - y;
  const d = Math.hypot(dx, dy) || 1;
  const m = Object.assign({ type, x, y, vx: dx / d * speed, vy: dy / d * speed, spin: rand(0, TAU) }, extra || {});
  missiles.push(m);
  return m;
}

// 지금 해역에서 얼마나 왔나 (0 = 해역 시작, 1 = 다음 해역 직전)
function stageFrac() {
  if (STAGES[stage].event === 'home') return Math.min(1, axesHit / SETTINGS.axeCount);   // 이타카의 섬: 맞힌 도끼만큼
  return Math.min(1, stageDist / stageLength(stage));
}

// 키클롭스의 바위: 크기도 속도도 바위마다 제각각 (크기와 속도는 서로 상관없음), 큰 바위일수록 더 아프다
function throwBoulder() {
  const r = rand(9, 26);
  // 던지기 직전, 배가 지금 있는 곳을 겨냥해서 빠르게 던진다 (날아가는 중엔 방향을 바꾸지 않음)
  const speed = rand(SETTINGS.boulderMinSpeed, SETTINGS.boulderMaxSpeed) * (1 + SETTINGS.rampSpeed * stageFrac());
  launch('boulder', rand(-20, W + 20), -30, speed, { r, damage: Math.round(10 + (r - 9) * 1.5), shape: makeShape(9, 0.8, 1.05) });
}

// 태양신의 벼락: 화면 사방(위·아래·왼쪽·오른쪽) 가장자리에서 번쩍 모였다가, 그 순간 배가 있는 곳으로 일직선으로 날아간다
function throwZap() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = rand(20, W - 20); y = SETTINGS.topLimit - 10; }
  else if (side === 1) { x = rand(20, W - 20); y = H - 6; }
  else if (side === 2) { x = 6; y = rand(SETTINGS.topLimit, H - 20); }
  else { x = W - 6; y = rand(SETTINGS.topLimit, H - 20); }
  if (dist(x, y, player.x, player.y) < 130) return;      // 배 바로 옆에서는 생기지 않는다
  const speed = SETTINGS.zapSpeed * (1 + SETTINGS.rampSpeed * stageFrac());
  missiles.push({ type: 'zap', x, y, vx: 0, vy: 0, spin: 0, wait: 40, speed, seed: rand(0, 100) });
}

// 키르케의 마법 음식: 맞으면 저주에 걸린다
const FOODS = ['bread', 'meat', 'grapes', 'cheese', 'wine'];
function throwFood() {
  const speed = SETTINGS.foodSpeed * (1 + SETTINGS.rampSpeed * stageFrac());
  launch('food', rand(0, W), -20, speed, { food: pick(FOODS) });
}

// 장애물(암석·섬) 위에 겹치는지 확인 — 목마와 물약은 바다 위에만 있어야 한다
function onObstacle(x, y, pad) {
  return obstacles.some(o => dist(x, y, o.x, o.y) < o.r + pad);
}

// 바다 위 빈자리를 찾아 떠다니는 아이템을 놓는다
function placeFloating(list, extra) {
  for (let i = 0; i < 8; i++) {
    const x = rand(30, W - 30), y = -24;
    if (!onObstacle(x, y, 30)) {
      list.push(Object.assign({ x, y, bob: rand(0, TAU) }, extra || {}));
      return;
    }
  }
}

// 새 장애물을 놓을 때, 그 자리에 떠 있던 목마와 물약은 치운다
function addObstacle(o) {
  if (whirls.some(w => dist(o.x, o.y, w.x, w.y) < w.R + o.r + 6)) return;   // 소용돌이 자리에는 장애물을 놓지 않는다
  obstacles.push(o);
  horses = horses.filter(h => dist(h.x, h.y, o.x, o.y) > o.r + 30);
  potions = potions.filter(p => dist(p.x, p.y, o.x, o.y) > o.r + 30);
}

// 스킬라의 촉수: 바다에서 솟아올라 배를 겨눈 뒤 그 방향으로 내리찍는다 (길이는 tentacleReach까지)
function makeTentacle(x, y, fromWhirl) {
  if (x === undefined) {
    const a = rand(0, TAU), d = rand(95, 135);
    x = clamp(player.x + Math.cos(a) * d, 24, W - 24);
    y = clamp(player.y + Math.sin(a) * d, SETTINGS.topLimit, H - 24);
  }
  return { x, y, ang: Math.atan2(player.y - y, player.x - x), t: 0, phase: 'warn', hp: 3,
           sway: rand(0, TAU), flash: 0, whirl: !!fromWhirl };
}

function makeWhirl() {
  const debris = [];
  for (let i = 0; i < 7; i++) debris.push({ r: rand(40, 145), a: rand(0, TAU), kind: i % 3 });
  const streaks = [];                                     // 수면 위 거품 줄기들 (안쪽일수록 빨리 돈다)
  for (let i = 0; i < 70; i++) streaks.push({ r: rand(24, 150), a: rand(0, TAU), len: rand(0.5, 1.4), w: rand(0.8, 2.6), al: rand(0.25, 0.75) });
  // 암석·섬과 겹치지 않는 자리를 찾는다 (못 찾으면 이번엔 생기지 않음)
  for (let i = 0; i < 12; i++) {
    const x = rand(110, W - 110), y = -160;
    if (!obstacles.some(o => dist(x, y, o.x, o.y) < 150 + o.r + 6)) {
      return { x, y, R: 150, core: 20, rot: 0, tT: 50, debris, streaks };
    }
  }
  return null;
}

function makeGhost() {
  return { x: rand(50, W - 50), y: -60, vx: 0, mode: 'enter', targetY: rand(110, 230),
           timer: rand(480, 660), fireT: rand(35, 55), chargeT: rand(150, 260), oar: rand(0, TAU), phase: rand(0, TAU), face: 0 };
}

function makeBolt() {
  const aimed = Math.random() < 0.5;          // 절반은 배를 노린다
  const x = aimed ? clamp(player.x + rand(-30, 30), 20, W - 20) : rand(30, W - 30);
  const y = aimed ? player.y - 70 : rand(110, H - 60);
  const path = [];
  for (let i = 0; i <= 8; i++) path.push(rand(-14, 14));
  return { x, y, t: 0, warn: 62, path };
}

// 칼립소의 태풍: 배의 2배 크기. 위쪽이나 옆쪽 가장자리에서 나타나 배를 향해 날아온다
// 망령선의 돌진처럼, 배를 지나치기 전까지는 배의 위치를 실시간으로 계산해 방향을 튼다
function makeTyphoon() {
  const side = Math.floor(Math.random() * 3);
  let x, y;
  if (side === 0) { x = rand(40, W - 40); y = -60; }
  else if (side === 1) { x = -60; y = rand(SETTINGS.topLimit, H * 0.55); }
  else { x = W + 60; y = rand(SETTINGS.topLimit, H * 0.55); }
  const speed = SETTINGS.typhoonSpeed * (1 + SETTINGS.rampSpeed * stageFrac());
  const dx = player.x - x, dy = player.y - y, d = Math.hypot(dx, dy) || 1;
  return { x, y, vx: dx / d * speed, vy: dy / d * speed, speed, rot: 0, R: 54, pull: 72, core: 22, age: 0, passed: false };
}

// 청혼자들의 배: 위에서 나타나 자리를 잡고, 뱃머리를 우리 배 쪽으로 돌려 불화살을 쏜다
function makeSuitor() {
  return { x: rand(50, W - 50), y: -50, mode: 'enter', targetY: rand(110, 260), offset: rand(-140, 140),
           timer: rand(600, 840), fireT: rand(50, 80), oar: rand(0, TAU), hp: SETTINGS.suitorHp, flash: 0, face: Math.PI };
}

// 이타카의 섬: 도끼 12개를 모두 꿰뚫었다 → 이타카가 보인다
function allAxesHit() {
  arriving = true;
  popup(W / 2, H / 2 - 40, '열두 개의 도끼를 모두 꿰뚫었다!', '#ffe08a');
  score += 500;
  for (const sd of suitors) sd.mode = 'leave';
  axes = [];
}

// 해역 시작 안내: 실제 시간으로 introTime초 (휴대폰은 게임이 느리게 흐르니 그만큼 줄여 맞춘다)
function startIntro() {
  introLen = Math.round(SETTINGS.introTime * 60 * (isTouch ? SETTINGS.touchGameSpeed : 1));
  bannerTimer = introLen;
  spawnDelay = introLen;
}
function skipIntro() {
  if (state === 'playing' && bannerTimer > 0) { bannerTimer = Math.min(bannerTimer, 15); spawnDelay = 0; }
}

// 해역마다 꼭 알아야 할 규칙 (해역 시작 전에 보여 준다)
const RULES = {
  cyclops:    ['바위는 던지는 순간 배가 있는 곳을 겨눈다', '바위마다 크기·속도가 다르고, 클수록 아프다', '트로이 목마를 주우면 선체가 고쳐진다'],
  giants:     ['섬 위의 거인이 창을 던진다', '불화살(Z) 3발이면 거인을 쓰러뜨릴 수 있다', '양쪽 섬 사이의 좁은 틈으로 지나가라'],
  circe:      ['마법 음식에 맞으면 저주 — 선체가 계속 깎인다', '또 맞으면 저주가 겹쳐 더 빨리 깎인다 (최대 ×5)', '하늘색 물약을 마시면 저주가 풀린다'],
  underworld: ['망령선에는 불화살이 통하지 않는다', '푸른 불꽃을 피하라', '돌진은 배를 쫓아온다 — 바짝 왔을 때 비켜라'],
  siren:      ['노래가 들리면 10초 동안 방향키가 뒤섞인다', '노래 직전에 예고가 뜬다', '부스터와 불화살은 뒤섞이지 않는다'],
  scylla:     ['촉수는 배를 정확히 내리찍는다 — 촉수 길이 밖으로 피하라', '소용돌이에 들어가면 빨려들며 선체가 깎인다 (가운데는 2배)', '소용돌이는 부스터로만 빠져나올 수 있다'],
  lightning:  ['그림자가 진 곳에 하늘에서 벼락이 떨어진다', '가장자리에서 번쩍이면 벼락이 배를 향해 날아온다', '날아오는 벼락은 암석·섬에 튕긴다'],
  typhoon:    ['태풍은 배를 지나치기 전까지 쫓아온다', '바짝 다가왔을 때 부스터로 비켜라', '휩쓸리면 '],   // 마지막 줄은 버전에 따라 채운다
  home:       ['불화살로 도끼 12개를 모두 맞혀야 이타카에 닿는다', '청혼자들의 배는 불화살 3발이면 가라앉는다', '청혼자들의 불화살을 피하라'],
};
function stageRules() {
  const ev = STAGES[stage].event;
  const r = RULES[ev].slice();
  if (ev === 'typhoon') r[2] = mode === 'easy' ? '휩쓸리면 칼립소의 섬 처음으로 되돌아간다' : '휩쓸리면 모든 것을 잃고 처음 바다로 되돌아간다';
  return r;
}

// 라이스트리고네스: 가운데 좁은 틈만 남기고 양쪽을 거대한 섬과 바위가 막는다
function spawnGiantRow() {
  const gap = rand(100, W - 100);
  const half = 73;
  const R1 = rand(80, 120), R2 = rand(80, 120);
  const left = Math.random() < 0.6 ? makeIsle(gap - half - R1 * 0.95, -R1, R1) : makeRock(gap - half - R1, -R1, R1);
  const right = Math.random() < 0.6 ? makeIsle(gap + half + R2 * 0.95, -R2, R2) : makeRock(gap + half + R2, -R2, R2);
  // 섬 위에는 거인이 서서 틈을 지나가는 배를 노린다
  if (left.kind === 'isle') left.giant = makeGiant(1);
  if (right.kind === 'isle') right.giant = makeGiant(-1);
  addObstacle(left);
  addObstacle(right);
}

// 거인: dir = 1이면 오른쪽(틈 쪽)을 보고, -1이면 왼쪽을 본다
function makeGiant(dir) {
  return { dir, hp: SETTINGS.giantHp, mode: 'idle', t: 0, cd: rand(30, 90), aim: dir > 0 ? 0.6 : Math.PI - 0.6, flash: 0 };
}

// 거인이 서 있는 자리 (섬 가운데에서 틈 쪽으로 조금)
function giantPos(o) {
  return { x: o.x + o.giant.dir * o.r * 0.55, y: o.y };
}

// 점과 선분 사이의 거리 (창에 맞았는지 확인할 때 쓴다)
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy || 1;
  const k = clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
  return dist(px, py, ax + dx * k, ay + dy * k);
}

function updateGiant(o) {
  const g = o.giant;
  const p = giantPos(o);
  if (g.flash > 0) g.flash--;
  if (g.cd > 0) g.cd--;
  const target = Math.atan2(player.y - p.y, player.x - p.x);
  if (g.mode === 'idle') {
    const diff = ((target - g.aim + Math.PI * 3) % TAU) - Math.PI;   // 가장 가까운 쪽으로 도는 각도
    g.aim += diff * 0.05;                                // 배 쪽을 노려본다
    if (g.cd <= 0 && p.y > -10 && p.y < H * 0.75) { g.mode = 'windup'; g.t = 0; }
  } else if (g.mode === 'windup') {                      // 창을 뒤로 젖혀 겨눈다
    g.t++;
    g.aim = target;
    if (g.t >= 34) {                                     // 휙! 지금 배가 있는 곳으로 던진다
      const speed = SETTINGS.spearSpeed * (1 + SETTINGS.rampSpeed * stageFrac());
      launch('spear', p.x + Math.cos(target) * 18, p.y + Math.sin(target) * 18, speed);
      g.mode = 'idle';
      g.cd = rand(130, 195) / (1 + SETTINGS.rampUp * stageFrac());
    }
  }
}


// ⑤ update: 1초에 약 60번 계산
function update() {
  const st = STAGES[stage];
  const ev = st.event;
  const sail = SETTINGS.sailSpeed;
  const now = performance.now();

  // --- 바람 (칼립소의 섬에서는 태풍 때문에 훨씬 거세다) ---
  windTimer--;
  if (windTimer <= 0) {
    windTarget = rand(-1, 1) * (0.45 + stage * 0.06) * (ev === 'typhoon' ? 1.8 : 1);
    windTimer = rand(300, 540);
  }
  windX += (windTarget - windX) * 0.01;

  // --- 항해 거리와 해역 ---
  if (!arriving) {
    if (spawnDelay === 0) {                               // 규칙 안내 중에는 해역 시간이 흐르지 않는다
      stageDist += sail;
      score += sail * 0.1;                                // 나아간 만큼 점수
    }
    if (STAGES[stage].event !== 'home' && stageDist >= stageLength(stage)) {   // 이타카의 섬은 거리 대신 도끼로 끝난다
      score += 300;
      popup(W / 2, H / 2 - 70, '+300  해역 돌파!');
      if (stage >= STAGES.length - 1) {
        arriving = true;                                  // 이타카가 보인다!
        for (const g of ghosts) g.mode = 'leave';
        for (const t of typhoons) t.leaving = true;
      } else {
        stage++;
        stageStartScore = score;                          // 쉬운 버전: 여기서부터 다시 시작할 수 있다
        stageDist = 0;
        startIntro();
        bannerNote = '';
        giantTimer = 0;
        for (const g of ghosts) g.mode = 'leave';         // 해역이 바뀌면 지난 해역의 위험은 물러난다
        for (const t of typhoons) t.leaving = true;
      }
    }
  } else {
    ithacaY += sail * 1.2;
    if (ithacaY >= 170) {
      score += player.hull * 5;                           // 남은 선체만큼 보너스
      endGame('victory');
      return;
    }
  }
  if (bannerTimer > 0) bannerTimer--;
  if (spawnDelay > 0) spawnDelay--;

  // --- 키르케의 저주: 하늘색 물약을 마시기 전까지 선체가 계속 줄어든다 ---
  if (poisoned) {
    player.hull -= SETTINGS.poisonDrain * poisonStack;   // 겹친 만큼 더 빨리 줄어든다
    if (tick % 6 === 0) particle(player.x + rand(-10, 10), player.y + rand(-15, 15), rand(-0.3, 0.3), -0.6, rand(1.5, 2.5), 30, '#c58cff', 'spark');
    if (player.hull <= 0) { shipwreck(); return; }
  }

  // --- 배 조종 ---
  // 세이렌의 노래: 바다 어디에 있든 들리고, 노래마다 방향키가 무작위로 뒤섞인다
  if (ev === 'siren' && !arriving && spawnDelay === 0) {
    song.t--;
    if (song.phase === 'quiet' && song.t <= 0) {
      song.phase = 'prelude';
      song.t = SETTINGS.songPrelude;
    } else if (song.phase === 'prelude' && song.t <= 0) {
      song.phase = 'singing';
      song.t = SETTINGS.songLength;
      song.map = shuffleArrows();
      shake = Math.max(shake, 4);
    } else if (song.phase === 'singing' && song.t <= 0) {
      song.phase = 'quiet';
      song.t = rand(SETTINGS.songGapMin, SETTINGS.songGapMax) / (1 + SETTINGS.rampUp * stageFrac());
      song.map = null;
    }
  } else if (song.phase !== 'quiet') {
    song = { phase: 'quiet', t: SETTINGS.songGapMin, map: null };   // 세이렌의 섬을 벗어나면 노래가 그친다
  }
  inSiren = song.phase === 'singing';
  let ix = 0, iy = 0;
  for (let i = 0; i < 4; i++) {
    if (!keys[ARROWS[i]]) continue;
    const d = inSiren ? song.map[ARROWS[i]] : DIRS[i];
    ix += d[0];
    iy += d[1];
  }
  if (inSiren && tick % 4 === 0) {                        // 바다 전체에 퍼지는 음표
    particle(rand(0, W), rand(90, H), rand(-0.4, 0.4), -rand(0.3, 0.8), rand(10, 16), 70, pick(['#ff9ad5', '#ffc4e6', '#e892bf']), 'note');
  }
  // --- 부스터 (스페이스): 게이지가 남아 있는 동안 노를 힘껏 저어 빠르게 움직인다 ---
  const wantBoost = keys['Space'] && (boosting ? boost > 0 : boost > 15);
  boosting = !!wantBoost;
  if (boosting) boost = Math.max(0, boost - SETTINGS.boostDrain);
  else boost = Math.min(100, boost + SETTINGS.boostRecharge);
  const mv = isTouch ? SETTINGS.touchSpeed : 1;            // 터치 화면이면 배가 천천히 움직인다
  const power = SETTINGS.accel * mv * (boosting ? SETTINGS.boostPower : 1);
  player.vx += ix * power;
  player.vy += iy * power;


  inWhirl = false;
  inWhirlCenter = false;
  for (const w of whirls) {                               // 소용돌이: 한가운데로 빨아들인다
    const dx = w.x - player.x, dy = w.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d < w.R * 0.88) {
      inWhirl = true;
      const nx = d > 0.5 ? dx / d : 0, ny = d > 0.5 ? dy / d : 0;
      const k = Math.min(1, d / 18);                      // 한가운데에 닿으면 끌림이 잦아들고 그 자리에서 맴돈다
      player.vx += (nx * SETTINGS.whirlPull * k - ny * 0.32) * mv;   // 배가 느린 만큼 끌림도 같은 비율로 (부스터로 탈출 가능)
      player.vy += (ny * SETTINGS.whirlPull * k + nx * 0.32) * mv;
      const center = d < w.core + 8;
      player.hull -= SETTINGS.whirlDrain * (center ? 2 : 1) * SETTINGS.damageScale;   // 한가운데에서는 피해 2배
      inWhirlCenter = center;
      if (tick % (center ? 9 : 18) === 0) redFlash = Math.max(redFlash, center ? 8 : 5);
      if (tick % 4 === 0) particle(player.x + rand(-12, 12), player.y + rand(-14, 14), rand(-0.6, 0.6), rand(-0.6, 0.6), rand(0.8, 1.8), 22, pick(['#8b5a2b', '#e8f7ff']), 'chip');
      if (player.hull <= 0) { shipwreck(); return; }
    }
  }

  for (const t of typhoons) {                             // 태풍: 바깥쪽 바람이 배를 휘감는다
    if (t.leaving) continue;
    const dx = t.x - player.x, dy = t.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d < t.pull && d > 1) {
      const s = 1 - d / t.pull;
      player.vx += ((dx / d) * s * 0.18 + (dy / d) * s * 0.35) * mv;
      player.vy += ((dy / d) * s * 0.18 + (-dx / d) * s * 0.35) * mv;
    }
    if (d < t.core) { blowBack(); return; }                // 태풍 한가운데에 휩쓸렸다!
  }

  const drag = boosting ? 0.9 : SETTINGS.drag;
  player.vx *= drag;
  player.vy *= drag;
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > 9) { player.vx *= 9 / sp; player.vy *= 9 / sp; }
  player.x += player.vx + windX * SETTINGS.windStrength * mv;
  player.y += player.vy;
  if (player.x < 16 || player.x > W - 16) { player.x = clamp(player.x, 16, W - 16); player.vx = 0; }
  if (player.y < SETTINGS.topLimit || player.y > H - 34) { player.y = clamp(player.y, SETTINGS.topLimit, H - 34); player.vy = 0; }
  // 뱃머리 회전: 가려는 방향으로 뱃머리를 부드럽게 돌린다 (0 = 위쪽, 손을 떼면 그 방향을 유지)
  if (ix || iy) {
    const want = Math.atan2(ix, -iy);
    let diff = want - player.heading;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    player.heading += clamp(diff, -SETTINGS.turnSpeed, SETTINGS.turnSpeed);
    if (player.heading > Math.PI) player.heading -= TAU;
    if (player.heading < -Math.PI) player.heading += TAU;
  }
  const hx = Math.sin(player.heading), hy = -Math.cos(player.heading);   // 뱃머리가 가리키는 방향
  const side = player.vx * -hy + player.vy * hx;                          // 옆으로 미끄러지는 정도 → 살짝 기울기
  player.tilt += (side * 0.04 - player.tilt) * 0.2;
  player.oar += 0.12 + (ix || iy ? 0.12 : 0) + (boosting ? 0.35 : 0);   // 부스터 중엔 노를 미친 듯이 젓는다
  if (boosting && tick % 2 === 0) {                       // 부스터 물보라
    for (const sd of [-1, 1]) {
      const along = rand(-10, 16);
      particle(player.x - hy * sd * 14 - hx * along, player.y + hx * sd * 14 - hy * along,
               -hy * sd * rand(0.8, 1.6) - hx, hx * sd * rand(0.8, 1.6) - hy + sail, rand(1.5, 2.5), 25, '#e8f7ff', 'drop');
    }
  }

  if (tick % 2 === 0) {
    for (const sd of [-1, 1]) {                           // 고물(배 뒤쪽)에서 하얀 물결이 갈라진다
      particle(player.x - hx * 24 - hy * sd * 6, player.y - hy * 24 + hx * sd * 6,
               -hx * 0.5 - hy * sd * 0.6, -hy * 0.5 + hx * sd * 0.6 + sail + 0.3, rand(2, 3), 45, '#ffffff', 'foam');
    }
  }

  // --- 불화살 ---
  if (keys['KeyZ'] && tick - lastShot > SETTINGS.shootDelay * 60 / 1000) {   // 게임 시간 기준이라 느려지면 쏘는 간격도 같이 느려진다
    // 불화살은 뱃머리가 향한 쪽으로 날아간다
    arrows.push({ x: player.x + hx * 36, y: player.y + hy * 36, vx: hx * SETTINGS.arrowSpeed, vy: hy * SETTINGS.arrowSpeed, ang: player.heading });
    lastShot = tick;
  }
  for (const a of arrows) { a.x += a.vx; a.y += a.vy; }
  arrows = arrows.filter(a => a.y > -20 && a.y < H + 20 && a.x > -20 && a.x < W + 20);

  // --- 새로운 장애물과 위험 등장 ---
  if (spawnDelay === 0 && !arriving) {
    const more = (1 + SETTINGS.rampUp * stageFrac()) * SETTINGS.hazardScale;   // 다음 해역에 가까워질수록 위험이 늘어난다
    const moreObs = 1 + SETTINGS.rampUp * 0.5 * stageFrac(); // 암석과 섬도 조금씩 늘어난다
    if (Math.random() < st.rock * moreObs) addObstacle(makeRock(rand(30, W - 30), -40, rand(14, 28)));
    if (Math.random() < st.isle * moreObs) {
      const r = rand(28, 46);
      addObstacle(makeIsle(rand(r, W - r), -r - 10, r));
    }
    if (Math.random() < st.horse * 1.25) placeFloating(horses);
    // 하늘색 해독 물약: 키르케의 섬에서 자주, 저주에 걸려 있으면 다른 해역에서도 가끔
    if ((ev === 'circe' && Math.random() < 0.0075) || (poisoned && ev !== 'circe' && Math.random() < 0.004)) {
      placeFloating(potions);
    }

    if (ev === 'cyclops' && Math.random() < 0.016 * more && missiles.filter(m => m.type === 'boulder').length < 5) throwBoulder();
    if (ev === 'circe' && Math.random() < 0.036 * more) throwFood();   // 음식 2배
    if (ev === 'giants') {
      giantTimer--;
      if (giantTimer <= 0) { spawnGiantRow(); giantTimer = Math.round(260 / more); }
    }
    if (ev === 'underworld' && Math.random() < 0.012 * more && ghosts.length < 3) ghosts.push(makeGhost());   // 망령선 1.5배
    if (ev === 'siren' && Math.random() < 0.0075 * more && sirens.length === 0) {
      sirens.push({ x: Math.random() < 0.5 ? 70 : W - 70, y: -140, R: 125, noteT: 0 });
    }
    if (ev === 'scylla') {
      if (Math.random() < 0.013 * more && tentacles.length < 3) tentacles.push(makeTentacle());
      if (Math.random() < 0.0065 * more && whirls.length === 0) { const w = makeWhirl(); if (w) whirls.push(w); }
      for (const w of whirls) {                           // 소용돌이 속에서도 촉수가 솟구친다
        w.tT--;
        if (w.tT <= 0 && w.y > 40 && tentacles.length < 4 && dist(w.x, w.y, player.x, player.y) < w.R * 0.55 + SETTINGS.tentacleReach) {
          const a = Math.atan2(player.y - w.y, player.x - w.x) + rand(-0.5, 0.5);
          tentacles.push(makeTentacle(w.x + Math.cos(a) * w.R * 0.55, w.y + Math.sin(a) * w.R * 0.55, true));
          w.tT = rand(80, 120) / more;
        }
      }
    }
    if (ev === 'lightning' && Math.random() < 0.022 * more) bolts.push(makeBolt());
    if (ev === 'lightning' && Math.random() < 0.0135 * more) throwZap();   // 사방 벼락 1.5배
    if (ev === 'home') {
      // 도끼는 트로이 목마처럼 바다 위에 떠내려온다 (화면에 없으면 더 자주)
      if (Math.random() < (axes.length === 0 ? 0.02 : 0.006) && axes.length < 3) placeFloating(axes, { spin: rand(-0.3, 0.3) });
      if (Math.random() < 0.008 * more && suitors.filter(sd => sd.mode !== 'leave').length < 2 + Math.round(stageFrac() * 2)) suitors.push(makeSuitor());
    }
    if (ev === 'typhoon' && Math.random() < 0.0035 * more && typhoons.filter(t => !t.leaving).length < 1) typhoons.push(makeTyphoon());
  }

  // --- 암석과 섬: 부딪히면 다친다. 불화살로 못 부숨 ---
  for (const o of obstacles) {
    o.y += sail;
    hitObstacle(o.x, o.y, o.kind === 'isle' ? o.r * 0.92 : o.r);
    if (state !== 'playing') return;
    if (o.giant) {
      updateGiant(o);
      if (state !== 'playing') return;
    }
  }
  obstacles = obstacles.filter(o => o.y - o.r < H + 20);

  // --- 세이렌 ---
  for (const s of sirens) {
    s.y += sail;
    hitObstacle(s.x, s.y, 18);
    if (state !== 'playing') return;
    s.noteT--;
    if (s.noteT <= 0) {
      const a = rand(0, TAU);
      particle(s.x, s.y - 14, Math.cos(a) * 0.8, Math.sin(a) * 0.8 - 0.3, 12, 70, '#ff9ad5', 'note');
      s.noteT = 10;
    }
  }
  sirens = sirens.filter(s => s.y < H + 160);

  // --- 소용돌이 ---
  for (const w of whirls) {
    w.y += sail;                                          // 암석·섬과 같은 빠르기로 떠내려온다 (겹치지 않게)
    w.rot += 0.05;
    for (const st of w.streaks) {                         // 물살: 바깥은 느리게, 안쪽은 빠르게 휘감기며 빨려든다
      st.a += 3.2 / (st.r + 10);
      st.r -= 0.12 + 6 / (st.r + 10);
      if (st.r < w.core + 2) { st.r = w.R * rand(0.9, 1); st.a = rand(0, TAU); }
    }
    for (const b of w.debris) {                           // 잔해가 빙글빙글 돌며 가운데로 빨려든다
      b.a += 2.2 / (b.r + 15);
      b.r -= 0.22;
      if (b.r < w.core) { b.r = w.R * rand(0.85, 0.98); b.a = rand(0, TAU); }
    }
    if (tick % 4 === 0) {                                 // 가장자리 물보라
      const a = rand(0, TAU), r = w.R * rand(0.8, 0.98);
      particle(w.x + Math.cos(a) * r, w.y + Math.sin(a) * r, -Math.sin(a) * 1.2, Math.cos(a) * 1.2, rand(1, 2), 26, pick(['#e8f7ff', '#bfe6f5']), 'drop');
    }
  }
  whirls = whirls.filter(w => w.y < H + 170);

  // --- 태풍: 배를 향해 날아온다 (지나치기 전까지 실시간으로 방향을 틀며 쫓아온다) ---
  for (const t of typhoons) {
    t.age++;
    if (!t.passed && !t.leaving) {
      const toX = player.x - t.x, toY = player.y - t.y;
      if (toX * t.vx + toY * t.vy < 0) {
        t.passed = true;                                  // 배를 지나쳤다! 이제부터는 그대로 직진
      } else {
        const want = Math.atan2(toY, toX);
        const cur = Math.atan2(t.vy, t.vx);
        const diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
        const turned = cur + clamp(diff, -SETTINGS.typhoonTurn, SETTINGS.typhoonTurn);
        t.vx = Math.cos(turned) * t.speed;
        t.vy = Math.sin(turned) * t.speed;
      }
    }
    t.x += t.vx;
    t.y += t.vy;
    t.rot += 0.09;
    if (tick % 3 === 0) particle(t.x - t.vx * 8 + rand(-15, 15), t.y - t.vy * 8 + rand(-15, 15), -t.vx * 0.2, -t.vy * 0.2, rand(2, 3.5), 30, 'rgba(220, 230, 240, 0.7)', 'foam');
    if (t.age > 90 && (t.x < -110 || t.x > W + 110 || t.y < -110 || t.y > H + 110)) t.gone = true;
  }
  typhoons = typhoons.filter(t => !t.gone && t.age < 900);

  // --- 저승의 망령선: 불화살이 통하지 않는다 ---
  for (const g of ghosts) {
    g.oar += 0.15;
    if (g.mode === 'enter') {
      g.y += 2.2;
      if (g.y >= g.targetY) g.mode = 'fight';
    } else if (g.mode === 'fight') {
      const want = clamp((player.x - g.x) * 0.03, -1.6, 1.6);
      g.vx += (want - g.vx) * 0.05;
      g.x = clamp(g.x + g.vx, 30, W - 30);
      g.y = g.targetY + Math.sin(tick * 0.03 + g.targetY) * 6;
      g.fireT--;
      if (g.fireT <= 0) {
        const dx = player.x - g.x, dy = player.y - (g.y + 20);
        const d = Math.hypot(dx, dy) || 1;
        const v = 3.0;
        ghostFire.push({ x: g.x, y: g.y + 22, vx: dx / d * v, vy: dy / d * v });
        g.fireT = 37 + rand(0, 20);                     // 불꽃 2배로 자주
      }
      g.timer--;
      if (g.timer <= 0) g.mode = 'leave';
      g.chargeT--;
      if (g.chargeT <= 0) { g.mode = 'windup'; g.t = 0; }  // 돌진 준비!
    } else if (g.mode === 'windup') {                     // 뱃머리를 우리 배 쪽으로 돌리며 귀기를 끌어모은다
      g.t++;
      const want = Math.atan2(player.y - g.y, player.x - g.x) - Math.PI / 2;
      const diff = ((want - g.face + Math.PI * 3) % TAU) - Math.PI;
      g.face += diff * 0.15;
      if (g.t >= 45) {                                    // 출발하는 순간 우리 배가 있는 곳으로 일직선 돌진
        const dx = player.x - g.x, dy = player.y - g.y;
        const d = Math.hypot(dx, dy) || 1;
        g.cvx = dx / d * SETTINGS.ghostChargeSpeed;
        g.cvy = dy / d * SETTINGS.ghostChargeSpeed;
        g.face = Math.atan2(g.cvy, g.cvx) - Math.PI / 2;
        g.mode = 'charge';
      }
    } else if (g.mode === 'charge') {
      // 우리 배를 지나치기 전까지는 배가 움직이는 대로 방향을 틀며 쫓아온다
      if (!g.passed) {
        const toX = player.x - g.x, toY = player.y - g.y;
        if (toX * g.cvx + toY * g.cvy < 0) {
          g.passed = true;                                // 배를 지나쳤다! 이제부터는 그대로 직진
        } else {
          const want = Math.atan2(toY, toX);
          const cur = Math.atan2(g.cvy, g.cvx);
          const diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
          const turned = cur + clamp(diff, -SETTINGS.ghostChargeTurn, SETTINGS.ghostChargeTurn);
          g.cvx = Math.cos(turned) * SETTINGS.ghostChargeSpeed;
          g.cvy = Math.sin(turned) * SETTINGS.ghostChargeSpeed;
          g.face = turned - Math.PI / 2;
        }
      }
      g.x += g.cvx;
      g.y += g.cvy;
      if (tick % 2 === 0) particle(g.x + rand(-6, 6), g.y + rand(-6, 6), -g.cvx * 0.2, -g.cvy * 0.2, rand(2, 3.5), 30, '#7dffb0', 'spark');
      if (g.x < -60 || g.x > W + 60 || g.y < -80 || g.y > H + 60) g.gone = true;   // 지나쳐서 화면 밖으로 나가면 저승으로 사라진다
    } else {
      g.y += sail + 1.6;
    }
    const charging = g.mode === 'charge';
    const hitW = charging ? 22 : 20, hitH = charging ? 30 : 42;
    if (Math.abs(g.x - player.x) < hitW && Math.abs(g.y - player.y) < hitH) {   // 들이받기
      if (hurt(charging ? SETTINGS.ghostChargeDamage : 20)) {
        player.vx += (player.x - g.x) > 0 ? 5 : -5;
        if (state !== 'playing') return;
      }
    }
  }
  ghosts = ghosts.filter(g => !g.gone && g.y < H + 70);

  for (const f of ghostFire) {                            // 망령의 푸른 불꽃
    f.x += f.vx;
    f.y += f.vy;
    if (tick % 2 === 0) particle(f.x, f.y, rand(-0.2, 0.2), rand(-0.2, 0.2), rand(1.5, 2.5), 20, '#7dffb0', 'spark');
    if (dist(f.x, f.y, player.x, player.y) < 14) {
      f.dead = true;
      if (hurt(12) && state !== 'playing') return;
    }
  }
  ghostFire = ghostFire.filter(f => !f.dead && f.x > -20 && f.x < W + 20 && f.y > -20 && f.y < H + 20);

  // --- 날아오는 바위·창·음식: 정해진 방향으로 일직선 ---
  for (const m of missiles) {
    if (m.wait > 0) {                                     // 벼락이 모이는 중 (제자리에서 번쩍번쩍)
      m.wait--;
      if (m.wait === 0) {                                 // 이 순간 배가 있는 곳을 겨눠 발사!
        const dx = player.x - m.x, dy = player.y - m.y;
        const d = Math.hypot(dx, dy) || 1;
        m.vx = dx / d * m.speed;
        m.vy = dy / d * m.speed;
      }
      continue;
    }
    m.x += m.vx;
    m.y += m.vy;
    m.spin += m.type === 'boulder' ? 0.06 : m.type === 'food' ? 0.12 : 0;
    if (m.type === 'boulder') {
      if (dist(m.x, m.y, player.x, player.y) < m.r + 10) {
        m.dead = true;
        splash(m.x, m.y, m.r + 14);
        shake = Math.max(shake, 4 + m.r * 0.2);
        if (hurt(m.damage) && state !== 'playing') return;
      }
    } else if (m.type === 'spear') {
      const len = Math.hypot(m.vx, m.vy) || 1;
      const tx = m.x - m.vx / len * 34, ty = m.y - m.vy / len * 34;   // 창 꼬리
      if (segDist(player.x, player.y, m.x, m.y, tx, ty) < 12) {
        m.dead = true;
        if (hurt(SETTINGS.spearDamage) && state !== 'playing') return;
      }
    } else if (m.type === 'zap') {
      // 암석·섬에 부딪히면 탱탱볼처럼 튕겨 나간다 (부딪힌 면을 기준으로 반사)
      if ((m.bounces || 0) < SETTINGS.zapBounces) {
        for (const o of obstacles) {
          const rr = (o.kind === 'isle' ? o.r * 0.92 : o.r) + 4;
          const dx = m.x - o.x, dy = m.y - o.y, d = Math.hypot(dx, dy);
          if (d < rr && d > 0.01) {
            const nx = dx / d, ny = dy / d;
            const rvy = m.vy - SETTINGS.sailSpeed;         // 장애물도 함께 떠내려오니 상대 속도로 계산
            const dot = m.vx * nx + rvy * ny;
            if (dot < 0) {
              const k = SETTINGS.zapBounciness;
              m.vx = (m.vx - 2 * dot * nx) * k;
              m.vy = (rvy - 2 * dot * ny) * k + SETTINGS.sailSpeed;
              m.bounces = (m.bounces || 0) + 1;
              m.x = o.x + nx * (rr + 1);
              m.y = o.y + ny * (rr + 1);
              for (let i = 0; i < 8; i++) {               // 부딪힌 자리에 번쩍 불꽃
                const a = rand(0, TAU), sp = rand(1, 3);
                particle(m.x, m.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.6), 16, '#e6f2ff', 'spark');
              }
              rings.push({ x: m.x, y: m.y, t: 0, life: 14, r: 14, color: 'rgba(200, 225, 255, 0.8)' });
            }
            break;
          }
        }
      }
      if (tick % 2 === 0) particle(m.x, m.y, rand(-0.5, 0.5), rand(-0.5, 0.5), rand(0.8, 1.6), 14, '#cfe9ff', 'spark');
      if (dist(m.x, m.y, player.x, player.y) < 14) {
        m.dead = true;
        whiteFlash = Math.max(whiteFlash, 4);
        burstColor(m.x, m.y, '#cfe9ff');
        if (hurt(SETTINGS.zapDamage) && state !== 'playing') return;
      }
    } else if (m.type === 'food') {
      if (dist(m.x, m.y, player.x, player.y) < 15) {
        m.dead = true;
        burstColor(m.x, m.y, '#c58cff');
        if (!poisoned) {
          poisoned = true;                                // 저주에 걸렸다!
          poisonStack = 1;
          popup(player.x, player.y - 30, '키르케의 저주!', '#d6a6ff');
        } else if (poisonStack < SETTINGS.poisonMaxStack) {
          poisonStack++;                                  // 또 맞으면 저주가 겹친다
          popup(player.x, player.y - 30, '저주 ×' + poisonStack + '!', '#e0a6ff');
        }
        shake = Math.max(shake, 4 + poisonStack);
      }
    }
  }
  missiles = missiles.filter(m => !m.dead && m.x > -60 && m.x < W + 60 && m.y > -60 && m.y < H + 60);

  // --- 제우스의 벼락 ---
  for (const b of bolts) {
    b.y += sail;
    b.t++;
    if (b.t === b.warn) {                                 // 쾅!
      whiteFlash = 8;
      shake = Math.max(shake, 8);
      splash(b.x, b.y, 30);
      for (let i = 0; i < 12; i++) {
        const a = rand(0, TAU), s = rand(1.5, 4);
        particle(b.x, b.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.8, 1.6), 20, '#cfe9ff', 'spark');
      }
      if (dist(b.x, b.y, player.x, player.y) < 34) {
        hurt(25);
        if (state !== 'playing') return;
      }
    }
  }
  bolts = bolts.filter(b => b.t < b.warn + 12);

  // --- 촉수 괴물 ---
  for (const t of tentacles) {
    t.y += sail;
    t.t++;
    if (t.flash > 0) t.flash--;
    if (t.phase === 'warn' && t.t >= 40) { t.phase = 'rise'; t.t = 0; splash(t.x, t.y, 20); }
    else if (t.phase === 'rise') {
      aimTentacle(t, (56 - t.t) + 8);
      if (t.t >= 56) { t.phase = 'slam'; t.t = 0; }
    }
    else if (t.phase === 'slam' && t.t < 8) aimTentacle(t, 8 - t.t);   // 내리찍는 중에도 끝까지 배를 쫓는다
    else if (t.phase === 'slam' && t.t >= 8) {            // 쾅! 내리찍는다
      t.phase = 'lie'; t.t = 0;
      const L = SETTINGS.tentacleReach;
      const ex = t.x + Math.cos(t.ang) * L, ey = t.y + Math.sin(t.ang) * L;
      for (let i = 1; i <= 4; i++) splash(t.x + (ex - t.x) * i / 4, t.y + (ey - t.y) * i / 4, 14 + i * 3);
      shake = Math.max(shake, 7);
      if (segDist(player.x, player.y, t.x, t.y, ex, ey) < 14 + 11) {
        if (hurt(SETTINGS.tentacleDamage)) {
          player.vx += -Math.sin(t.ang) * 3; player.vy += Math.cos(t.ang) * 3;
          if (state !== 'playing') return;
        }
      }
    }
    else if (t.phase === 'lie') {                         // 물 위에 잠깐 늘어져 있다 — 닿아도 아프다
      const sh = tentacleShape(t);
      if (segDist(player.x, player.y, t.x, t.y, t.x + Math.cos(t.ang) * sh.len, t.y + Math.sin(t.ang) * sh.len) < 9 + 11) {
        if (hurt(10) && state !== 'playing') return;
      }
      if (t.t >= 38) { t.phase = 'sink'; t.t = 0; }
    }
    else if (t.phase === 'sink' && t.t >= 20) { t.dead = true; }
  }

  // --- 불화살 맞히기 (망령선은 그냥 통과한다) ---
  for (const a of arrows) {
    for (const o of obstacles) {                          // 섬 위의 거인을 먼저 확인 (거인은 쓰러뜨릴 수 있다)
      if (!o.giant) continue;
      const p = giantPos(o);
      if (dist(a.x, a.y, p.x, p.y) < 18) {
        a.dead = true;
        o.giant.hp--;
        o.giant.flash = 6;
        burstColor(a.x, a.y, '#e8eef4');
        if (o.giant.hp <= 0) {                            // 거인을 쓰러뜨렸다!
          score += 150;
          popup(p.x, p.y - 24, '+150 거인 격파!');
          for (let i = 0; i < 18; i++) {
            const an = rand(0, TAU), s = rand(1, 3.5);
            particle(p.x, p.y, Math.cos(an) * s, Math.sin(an) * s, rand(1.5, 3.5), 40, pick(['#cfd8e0', '#8f9aa5', '#a8704f']), 'chip');
          }
          rings.push({ x: p.x, y: p.y, t: 0, life: 22, r: 40, color: '', fire: true });
          shake = Math.max(shake, 6);
          o.giant = null;
        }
        break;
      }
    }
    if (a.dead) continue;
    for (const o of obstacles) {                          // 불화살은 섬 위로는 날아가지만 암석에는 막힌다
      if (o.kind === 'rock' && dist(a.x, a.y, o.x, o.y) < o.r) {
        a.dead = true;
        particle(a.x, a.y, rand(-1, 1), rand(0, 1), 1.2, 15, '#ffcf70', 'spark');
        break;
      }
    }
    if (a.dead) continue;
    for (const sd of suitors) {                           // 청혼자의 배
      if (dist(a.x, a.y, sd.x, sd.y) < 20) {
        a.dead = true;
        sd.hp--;
        sd.flash = 6;
        burstColor(a.x, a.y, '#ffcf70');
        if (sd.hp <= 0 && !sd.dead) {
          sd.dead = true;
          score += 120;
          popup(sd.x, sd.y - 24, '+120 청혼자 격침!');
          woodBurst(sd.x, sd.y, 2);
          splash(sd.x, sd.y, 36);
          shake = Math.max(shake, 6);
        }
        break;
      }
    }
    if (a.dead) continue;
    for (const ax of axes) {                              // 도끼 (자루 위 도끼날 고리를 꿰뚫는다)
      if (dist(a.x, a.y, ax.x, ax.y - 8) < 17) {
        a.dead = true;
        ax.dead = true;
        axesHit++;
        score += 100;
        popup(ax.x, ax.y - 26, '도끼 ' + axesHit + ' / ' + SETTINGS.axeCount, '#ffe08a');
        burstColor(ax.x, ax.y - 8, '#ffe08a');
        rings.push({ x: ax.x, y: ax.y - 8, t: 0, life: 24, r: 30, color: 'rgba(255, 224, 138, 0.8)' });
        if (axesHit >= SETTINGS.axeCount && !arriving) allAxesHit();
        break;
      }
    }
    if (a.dead) continue;
    for (const t of tentacles) {
      if (t.phase === 'warn' || t.phase === 'sink') continue;
      const sh = tentacleShape(t);
      const tx = t.x + Math.cos(t.ang) * sh.len, ty = t.y + Math.sin(t.ang) * sh.len - sh.lift;
      if (segDist(a.x, a.y, t.x, t.y, tx, ty) < 15) {
        a.dead = true;
        t.hp--;
        t.flash = 6;
        break;
      }
    }
  }
  arrows = arrows.filter(a => !a.dead);

  for (const t of tentacles) {
    if (t.hp <= 0 && !t.dead) {
      t.dead = true;
      score += 80;
      popup(t.x, t.y - 20, '+80 촉수 격파!');
      for (let i = 0; i < 14; i++) {
        const a = rand(0, TAU), s = rand(0.8, 3);
        particle(t.x, t.y - 15, Math.cos(a) * s, Math.sin(a) * s, rand(1.5, 3), 35, pick(['#b04a8a', '#6b2d5c', '#f3c6d8']), 'chip');
      }
      splash(t.x, t.y, 24);
    }
  }
  tentacles = tentacles.filter(t => !t.dead);

  // --- 청혼자들의 배 ---
  for (const sd of suitors) {
    sd.oar += 0.15;
    if (sd.flash > 0) sd.flash--;
    if (sd.mode === 'enter') {
      sd.y += 2;
      if (sd.y >= sd.targetY) sd.mode = 'fight';
    } else if (sd.mode === 'fight') {
      const tx = clamp(player.x + sd.offset, 40, W - 40);
      sd.x += clamp((tx - sd.x) * 0.02, -1.4, 1.4);
      sd.y = sd.targetY + Math.sin(tick * 0.03 + sd.targetY) * 8;
      sd.fireT--;
      if (sd.fireT <= 0) {                                // 이 순간 우리 배가 있는 곳을 겨눠 불화살!
        const bx = sd.x + Math.sin(sd.face) * 30, by = sd.y - Math.cos(sd.face) * 30;
        const dx = player.x - bx, dy = player.y - by, d = Math.hypot(dx, dy) || 1;
        const v = SETTINGS.suitorArrowSpeed * (1 + SETTINGS.rampSpeed * stageFrac());
        suitorArrows.push({ x: bx, y: by, vx: dx / d * v, vy: dy / d * v, ang: Math.atan2(dx, -dy) });
        sd.fireT = SETTINGS.suitorFireDelay * rand(0.85, 1.2) / (1 + 0.5 * SETTINGS.rampUp * stageFrac());
      }
      sd.timer--;
      if (sd.timer <= 0) sd.mode = 'leave';
    } else {
      sd.y += sail + 1.6;
    }
    // 뱃머리는 우리 배 쪽으로 (물러날 때는 아래로)
    const want = sd.mode === 'leave' ? Math.PI : Math.atan2(player.x - sd.x, -(player.y - sd.y));
    const diff = ((want - sd.face + Math.PI * 3) % TAU) - Math.PI;
    sd.face += diff * 0.08;
    if (dist(sd.x, sd.y, player.x, player.y) < 28) {      // 들이받기
      if (hurt(15)) {
        player.vx += (player.x - sd.x) > 0 ? 5 : -5;
        if (state !== 'playing') return;
      }
    }
  }
  suitors = suitors.filter(sd => !sd.dead && sd.y < H + 70);

  for (const f of suitorArrows) {                         // 청혼자들의 불화살 (암석에 막힌다)
    f.x += f.vx;
    f.y += f.vy;
    if (obstacles.some(o => o.kind === 'rock' && dist(f.x, f.y, o.x, o.y) < o.r)) {
      f.dead = true;
      particle(f.x, f.y, rand(-1, 1), rand(-1, 1), 1.2, 15, '#ffcf70', 'spark');
      continue;
    }
    if (dist(f.x, f.y, player.x, player.y) < 13) {
      f.dead = true;
      if (hurt(SETTINGS.suitorArrowDamage) && state !== 'playing') return;
    }
  }
  suitorArrows = suitorArrows.filter(f => !f.dead && f.x > -20 && f.x < W + 20 && f.y > -20 && f.y < H + 20);

  for (const ax of axes) { ax.y += sail; ax.bob += 0.05; }
  axes = axes.filter(ax => !ax.dead && ax.y < H + 40);

  // --- 트로이 목마 줍기 ---
  for (const h of horses) {
    h.y += sail;
    h.bob += 0.06;
    if (dist(h.x, h.y, player.x, player.y) < 24) {        // 선체 수리
      h.dead = true;
      player.hull = Math.min(SETTINGS.hull, player.hull + SETTINGS.repair);
      score += 50;
      popup(h.x, h.y - 10, '선체 수리 +' + SETTINGS.repair, '#9ff0b4');
      burstColor(h.x, h.y, '#ffe08a');
    }
  }
  horses = horses.filter(h => !h.dead && h.y < H + 30);

  // --- 하늘색 해독 물약 줍기 ---
  for (const p of potions) {
    p.y += sail;
    p.bob += 0.06;
    if (dist(p.x, p.y, player.x, player.y) < 22) {
      p.dead = true;
      if (poisoned) {
        poisoned = false;
        poisonStack = 0;
        score += 100;
        popup(p.x, p.y - 10, '저주가 풀렸다! +100', '#9fe8ff');
      } else {
        score += 30;
        popup(p.x, p.y - 10, '+30', '#9fe8ff');
      }
      burstColor(p.x, p.y, '#8fe3ff');
    }
  }
  potions = potions.filter(p => !p.dead && p.y < H + 30);

  if (invincible > 0) invincible--;
}

function burstColor(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = rand(0, TAU), s = rand(1, 2.5);
    particle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(1, 2), 30, color, 'spark');
  }
}

// 암석·섬·세이렌 바위에 부딪혔는지 확인하고 튕겨내기
function hitObstacle(x, y, r) {
  const d = dist(x, y, player.x, player.y);
  const minD = r + 11;
  if (d < minD && d > 0.01) {
    const nx = (player.x - x) / d, ny = (player.y - y) / d;
    player.x = x + nx * minD;
    player.y = y + ny * minD;
    player.vx = nx * 4;
    player.vy = ny * 4;
    if (hurt(15)) splash(player.x - nx * 10, player.y - ny * 10, 18);
  }
}

// 촉수 조준: 배가 움직이는 방향과 속도로 '바다에 닿는 순간' 배가 있을 곳을 계산해 그쪽을 정확히 겨눈다
// (닿을 수 있는 길이는 tentacleReach까지 — 그보다 멀리 도망치면 피할 수 있다)
function aimTentacle(t, framesLeft) {
  const lead = Math.min(framesLeft, 30);
  const px = player.x + player.vx * lead, py = player.y + player.vy * lead;
  t.ang = Math.atan2(py - t.y, px - t.x);
}

// 촉수의 모양: len = 물 위로 뻗은 길이, lift = 공중에 치켜든 높이
function tentacleShape(t) {
  const L = SETTINGS.tentacleReach;
  if (t.phase === 'rise') { const k = Math.min(1, t.t / 14); return { len: L * 0.3 * k, lift: 55 * k + Math.sin(t.t * 0.2) * 3 }; }
  if (t.phase === 'slam') { const p = Math.min(1, t.t / 8); const e = p * p; return { len: L * (0.3 + 0.7 * e), lift: 55 * (1 - e) }; }
  if (t.phase === 'lie')  return { len: L, lift: 0 };
  if (t.phase === 'sink') return { len: L * Math.max(0, 1 - t.t / 20), lift: 0 };
  return { len: 0, lift: 0 };
}

function updateEffects() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.kind === 'chip' || p.kind === 'spark' || p.kind === 'drop') {
      p.vx *= 0.95;
      p.vy = p.vy * 0.95 + SETTINGS.sailSpeed * 0.05;
    }
    p.t++;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const r of rings) { r.t++; r.y += SETTINGS.sailSpeed; }
  rings = rings.filter(r => r.t < r.life);
  for (const p of popups) { p.t++; p.y -= 0.6; }
  popups = popups.filter(p => p.t < 55);
}


// ⑥ draw: 화면 그리기
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawSea();

  if (state === 'start') {
    drawStartScreen();
    ctx.restore();
    drawVignette();
    return;
  }
  if (state === 'victory') {
    drawVictoryScreen();
    ctx.restore();
    drawVignette();
    return;
  }

  const ev = STAGES[stage].event;
  drawMood(ev);
  if (arriving) drawIthaca(W / 2, ithacaY, 1);

  for (const w of whirls) drawWhirl(w);
  for (const s of sirens) drawSirenArea(s);
  for (const t of tentacles) drawTentacleWarn(t);
  for (const b of bolts) if (b.t < b.warn) drawBoltWarn(b);
  drawParticles('below');
  for (const o of obstacles) { if (o.kind === 'isle') drawIsle(o); else drawRock(o); }
  for (const s of sirens) drawSiren(s);
  for (const h of horses) drawHorse(h);
  for (const ax of axes) drawAxe(ax);
  for (const p of potions) drawPotion(p);
  for (const t of tentacles) if (t.phase !== 'warn') drawTentacle(t);
  for (const g of ghosts) drawGhostShip(g);
  for (const sd of suitors) drawSuitor(sd);

  if (state === 'playing' || state === 'paused') {
    if (!(invincible > 0 && Math.floor(invincible / 5) % 2 === 0)) {
      drawShip(player.x, player.y, { tilt: player.heading + player.tilt, oar: player.oar, poisoned: poisoned ? poisonStack : 0 });
    }
  }

  drawArrows();
  drawGhostFire();
  drawSuitorArrows();
  drawMissiles();
  for (const t of typhoons) drawTyphoon(t);
  for (const b of bolts) if (b.t >= b.warn) drawBoltStrike(b);
  if (ev === 'lightning' || ev === 'typhoon') drawRain();
  drawParticles('above');
  drawRings();
  drawPopups();
  ctx.restore();

  drawVignette();
  if (redFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(255, 0, 0, 0)');
    g.addColorStop(1, 'rgba(200, 20, 20, ' + (redFlash / 18 * 0.5) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if (whiteFlash > 0) {
    ctx.fillStyle = 'rgba(230, 240, 255, ' + (whiteFlash / 8 * 0.45) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();

  if (state === 'playing') {
    let warnY = STAGES[stage].event === 'home' && !arriving ? 126 : 104;
    if (inWhirl) drawText(inWhirlCenter ? '소용돌이 한가운데! 피해 2배 — 부스터로 탈출하라!' : '소용돌이에 빨려든다! 부스터(스페이스)로 탈출하라!', W / 2, warnY + 22, FONT_KR(12, 700), '#ff8a8a', 'center', 8);
    if (song.phase === 'prelude') {
      ctx.globalAlpha = 0.5 + Math.sin(tick * 0.3) * 0.5;
      drawText('♪ 어디선가 세이렌의 노래가 들려온다… ♪', W / 2, warnY, FONT_KR(13, 700), '#ffc4e6', 'center', 8);
      ctx.globalAlpha = 1;
      warnY += 22;
    }
    if (inSiren) {
      drawText('♪ 세이렌의 노래 — 방향키가 뒤섞였다! ' + Math.ceil(song.t / 60) + '초 ♪', W / 2, warnY, FONT_KR(13, 700), '#ff9ad5', 'center', 10);
      warnY += 22;
    }
    if (poisoned) {
      ctx.globalAlpha = 0.7 + Math.sin(tick * 0.15) * 0.3;
      drawText('키르케의 저주 ×' + poisonStack + '! 하늘색 물약을 마셔야 풀린다', W / 2, warnY, FONT_KR(12, 700), '#d6a6ff', 'center', 8);
      ctx.globalAlpha = 1;
      warnY += 22;
    }
    if (typhoons.some(t => !t.leaving && t.age < 70)) drawText('⚠ 태풍 접근!', W / 2, warnY, FONT_KR(14, 700), '#ffd07a', 'center', 10);
  }

  if (state === 'playing' && bannerTimer > 0) drawIntro();
  if (arriving && state === 'playing') {
    drawText('이타카가 보인다!', W / 2, H / 2 + 120, FONT_KR(20, 700), '#ffe7a3', 'center', 12);
  }

  if (state === 'blown') drawBlown();

  if (state === 'paused') {
    dimScreen();
    panel(W / 2 - 120, H / 2 - 55, 240, 110);
    drawText('PAUSED', W / 2, H / 2 - 8, FONT_EN(28, 900), '#f3e6c4', 'center', 10);
    drawText(isTouch ? '화면을 터치해 계속' : 'P를 눌러 계속', W / 2, H / 2 + 28, FONT_KR(14, 500), '#a9c3d1');
  }

  if (state === 'gameover') {
    dimScreen();
    panel(W / 2 - 160, H / 2 - 110, 320, 220);
    drawText('SHIPWRECKED', W / 2, H / 2 - 58, FONT_EN(28, 900), '#ef6f6c', 'center', 14);
    drawText('오디세우스호가 난파했습니다', W / 2, H / 2 - 24, FONT_KR(14, 500), '#d6e4ec');
    drawText('SCORE  ' + Math.floor(score), W / 2, H / 2 + 14, FONT_EN(20, 700), '#ffffff');
    drawText(STAGES[stage].name + '에서 · 이타카까지 ' + leagueText() + ' 남음', W / 2, H / 2 + 42, FONT_KR(12, 400), '#a9d3e6');
    if (mode === 'easy') {
      blinkText((isTouch ? '터치  ' : 'SPACE  ') + (stage + 1) + '단계 ' + STAGES[stage].name + '부터 다시', H / 2 + 74);
    } else {
      blinkText(isTouch ? '화면을 터치해 다시 출항' : 'PRESS SPACE TO SAIL AGAIN', H / 2 + 74);
    }
    drawText(isTouch ? '[ 여기를 터치: 버전 다시 고르기 ]' : 'M  버전 다시 고르기', W / 2, H / 2 + 98, FONT_KR(11, 500), '#8fb6c9');
  }
}

function leagueText() {
  return Math.round(1200 * (1 - progress())).toLocaleString('ko-KR') + ' 해리';
}

// --- 바다 ---
function drawSea() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f4c70');
  g.addColorStop(0.5, '#0a3756');
  g.addColorStop(1, '#06233a');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  const flow = tick * SETTINGS.sailSpeed * 0.5;
  glow(120 + Math.sin(tick * 0.004) * 40, (flow % (H + 400)) - 200, 230, 'rgba(70, 180, 210, 0.10)');
  glow(360 - Math.sin(tick * 0.003) * 50, ((flow + 450) % (H + 400)) - 200, 260, 'rgba(40, 150, 200, 0.09)');

  ctx.lineWidth = 1.2;
  for (const w of waves) {
    ctx.strokeStyle = 'rgba(210, 240, 255, ' + w.a + ')';
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.len, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  }
  for (const s of glitters) {
    const a = Math.max(0, Math.sin(tick * 0.06 + s.phase));
    ctx.fillStyle = 'rgba(255, 255, 240, ' + (a * 0.7) + ')';
    ctx.fillRect(s.x, s.y, 1.6, 1.6);
  }
}

// 해역마다 다른 분위기 (저승은 어둡게, 폭풍 해역은 흐리게)
function drawMood(ev) {
  if (ev === 'underworld') {
    ctx.fillStyle = 'rgba(4, 10, 12, 0.6)';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    const drift = Math.sin(tick * 0.01) * 30;
    glow(100 + drift, 220, 200, 'rgba(90, 200, 140, 0.10)');
    glow(380 - drift, 480, 220, 'rgba(90, 200, 160, 0.08)');
    if (tick % 8 === 0) particle(rand(0, W), H + 5, rand(-0.2, 0.2), -rand(0.6, 1.2), rand(1, 2), 160, '#9fffc8', 'soul');
  } else if (ev === 'lightning' || ev === 'typhoon') {
    ctx.fillStyle = 'rgba(14, 20, 30, 0.38)';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  } else if (ev === 'siren' && song.phase !== 'quiet') {   // 노래가 들리면 바다 전체가 분홍빛으로 물든다
    const k = song.phase === 'singing' ? 1 : 0.4;
    ctx.fillStyle = 'rgba(255, 120, 200, ' + ((0.07 + Math.sin(tick * 0.08) * 0.03) * k) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  } else if (ev === 'circe') {
    glow(W / 2, 120, 300, 'rgba(160, 90, 220, 0.08)');
  } else if (ev === 'home') {
    glow(W / 2, -40, 340, 'rgba(255, 210, 140, 0.16)');
  }
}

function drawRain() {
  ctx.strokeStyle = 'rgba(200, 220, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 70; i++) {
    const x = (i * 73 + tick * (3 + windX * 3)) % (W + 40) - 20;
    const y = (i * 131 + tick * 12) % (H + 20) - 10;
    ctx.moveTo(x, y);
    ctx.lineTo(x - 3 - windX * 4, y + 12);
  }
  ctx.stroke();
}

function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, 'rgba(0, 0, 0, 0)');
  g.addColorStop(1, 'rgba(0, 8, 16, 0.5)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// --- 배 (위에서 내려다본 고대 그리스 갤리선) ---
// o.ghost: 저승의 망령선 / o.poisoned: 저주에 걸린 상태
function drawShip(x, y, o) {
  const ghost = !!o.ghost;
  const suitor = !!o.suitor;                               // 청혼자의 배: 검붉은 선체, 자줏빛 돛, 금빛 장식
  ctx.save();
  ctx.translate(x, y);
  if (ghost) ctx.rotate(Math.PI);                         // 망령선은 마주 보고 온다
  ctx.rotate(o.tilt || 0);
  if (o.scale) ctx.scale(o.scale, o.scale);

  ctx.strokeStyle = ghost ? '#2a3a33' : suitor ? '#8a6a4a' : '#c9a36b';         // 노
  ctx.lineWidth = 1.3;
  for (let i = 0; i < 6; i++) {
    const oy = -12 + i * 5;
    const swing = Math.sin((o.oar || 0) + i * 0.5) * 4;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 10, oy);
      ctx.lineTo(side * 20, oy + swing);
      ctx.stroke();
    }
  }

  const hull = ghost ? ['#07090a', '#1a1f1e', '#050606'] : suitor ? ['#2e0f17', '#6e2433', '#22090f'] : ['#5a3a22', '#a8743f', '#4a2e1a'];
  ctx.beginPath();
  ctx.moveTo(0, -30);
  ctx.quadraticCurveTo(13, -14, 12, 6);
  ctx.lineTo(10, 22);
  ctx.quadraticCurveTo(0, 28, -10, 22);
  ctx.lineTo(-12, 6);
  ctx.quadraticCurveTo(-13, -14, 0, -30);
  ctx.closePath();
  const hg = ctx.createLinearGradient(-13, 0, 13, 0);
  hg.addColorStop(0, hull[0]);
  hg.addColorStop(0.5, hull[1]);
  hg.addColorStop(1, hull[2]);
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.strokeStyle = ghost ? 'rgba(120, 255, 180, 0.45)' : 'rgba(20, 10, 0, 0.6)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.save();                                              // 갑판과 판자
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.quadraticCurveTo(9, -12, 8.5, 6);
  ctx.lineTo(7, 19);
  ctx.quadraticCurveTo(0, 23, -7, 19);
  ctx.lineTo(-8.5, 6);
  ctx.quadraticCurveTo(-9, -12, 0, -24);
  ctx.closePath();
  ctx.fillStyle = ghost ? '#111614' : suitor ? '#8c5a46' : '#c39563';
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = ghost ? 'rgba(80, 160, 120, 0.25)' : 'rgba(60, 35, 15, 0.35)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  for (let py = -22; py < 24; py += 4) {
    ctx.moveTo(-10, py);
    ctx.lineTo(10, py);
  }
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = ghost ? '#3a4a42' : '#d4a24c';           // 청동 충각
  ctx.beginPath();
  ctx.moveTo(-2, -29);
  ctx.lineTo(2, -29);
  ctx.lineTo(0, -35);
  ctx.closePath();
  ctx.fill();
  for (const side of [-1, 1]) {                            // 뱃머리에 그린 눈
    ctx.fillStyle = ghost ? '#7dffb0' : '#ffffff';
    ctx.beginPath();
    ctx.ellipse(side * 6.5, -19, 2.2, 1.4, side * 0.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = ghost ? '#0a1a12' : '#111';
    ctx.beginPath();
    ctx.arc(side * 6.5, -19, 0.8, 0, TAU);
    ctx.fill();
  }

  const sail = ghost ? ['#141816', '#050606'] : suitor ? ['#6a2c78', '#3c1446'] : ['#f6eedb', '#d8caa8'];
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-17, -6);
  ctx.quadraticCurveTo(0, -13, 17, -6);
  if (ghost) {                                             // 망령선의 돛은 너덜너덜
    ctx.lineTo(15, 0);
    ctx.lineTo(11, -2);
    ctx.lineTo(7, 2);
    ctx.lineTo(1, -1);
    ctx.lineTo(-5, 2);
    ctx.lineTo(-10, -2);
    ctx.lineTo(-15, 1);
  } else {
    ctx.lineTo(17, 2);
    ctx.quadraticCurveTo(0, -5, -17, 2);
  }
  ctx.closePath();
  const sg = ctx.createLinearGradient(0, -12, 0, 2);
  sg.addColorStop(0, sail[0]);
  sg.addColorStop(1, sail[1]);
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.clip();
  if (!ghost) {
    ctx.fillStyle = suitor ? '#e9c46a' : '#b23a2e';
    ctx.fillRect(-11, -14, 4, 18);
    ctx.fillRect(7, -14, 4, 18);
  }
  ctx.restore();
  ctx.strokeStyle = ghost ? '#26302b' : '#6b4a2a';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-18, -6);
  ctx.quadraticCurveTo(0, -13, 18, -6);
  ctx.stroke();
  ctx.fillStyle = ghost ? '#0a0d0c' : '#3d2a17';
  ctx.beginPath();
  ctx.arc(0, -4, 1.6, 0, TAU);
  ctx.fill();

  if (o.poisoned) {                                        // 저주에 걸리면 보랏빛이 감돈다
    ctx.globalCompositeOperation = 'lighter';
    glow(0, 0, 24 + o.poisoned * 3, 'rgba(170, 90, 255, ' + (0.15 + o.poisoned * 0.07 + Math.sin(tick * 0.15) * 0.1) + ')');   // 겹칠수록 진해진다
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

// 저승의 망령선: 검은 배가 깜빡이듯 흐려지고 초록 귀기가 감돈다
function drawGhostShip(g) {
  ctx.globalCompositeOperation = 'lighter';
  const power = g.mode === 'windup' ? Math.min(1, g.t / 45) : g.mode === 'charge' ? 1 : 0;
  glow(g.x, g.y, 40 + power * 25, 'rgba(90, 255, 160, ' + (0.12 + power * 0.35) + ')');   // 돌진할 때 귀기가 강해진다
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = power > 0 ? 0.95 : 0.65 + Math.sin(tick * 0.08 + g.phase) * 0.25;
  const jitter = g.mode === 'windup' ? (Math.random() - 0.5) * 3 * power : 0;   // 부르르 떤다
  drawShip(g.x + jitter, g.y + jitter, { ghost: true, oar: g.oar, tilt: g.face });
  ctx.globalAlpha = 1;
}

// --- 해역 시작 안내: 해역 이름 + 중요 규칙 + 남은 시간 막대 ---
function drawIntro() {
  const a = Math.min(1, bannerTimer / 15, (introLen - bannerTimer) / 15);
  ctx.globalAlpha = a;
  const rules = stageRules();
  const pw = 420, ph = 126 + rules.length * 24 + 38 + (bannerNote ? 22 : 0), px = W / 2 - pw / 2, py = H / 2 - 130;
  panel(px, py, pw, ph);
  drawText('SEA ' + (stage + 1) + ' / ' + STAGES.length, W / 2, py + 30, FONT_EN(15, 700), '#e9c46a', 'center', 8);
  drawText(STAGES[stage].name, W / 2, py + 62, FONT_KR(24, 700), '#ffffff', 'center', 12);
  drawText(STAGES[stage].desc, W / 2, py + 86, FONT_KR(12, 500), '#bfe3f2');
  ctx.fillStyle = 'rgba(233, 196, 106, 0.3)';
  ctx.fillRect(px + 30, py + 100, pw - 60, 1);
  rules.forEach((r, i) => {
    const y = py + 126 + i * 24;
    ctx.fillStyle = '#e9c46a';
    ctx.beginPath(); ctx.arc(px + 32, y - 4, 2.5, 0, TAU); ctx.fill();
    drawText(r, px + 44, y, FONT_KR(r.length > 26 ? 11.5 : 13, 500), '#f3e6c4', 'left');
  });
  let y = py + 126 + rules.length * 24;
  if (bannerNote) { drawText(bannerNote, W / 2, y + 2, FONT_KR(12, 700), '#ffd07a'); y += 22; }
  // 남은 시간 막대 + 건너뛰기 안내
  const k = bannerTimer / introLen;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.fillRect(px + 30, y + 4, pw - 60, 3);
  ctx.fillStyle = '#e9c46a';
  ctx.fillRect(px + 30, y + 4, (pw - 60) * k, 3);
  drawText(isTouch ? '화면을 터치하면 바로 출항' : 'ENTER  바로 출항', W / 2, y + 24, FONT_KR(10, 500), '#8fb6c9');
  ctx.globalAlpha = 1;
}

// --- 청혼자들의 배 ---
function drawSuitor(sd) {
  drawShip(sd.x, sd.y, { suitor: true, oar: sd.oar, tilt: sd.face });
  if (sd.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    glow(sd.x, sd.y, 30, 'rgba(255, 200, 120, 0.55)');
    ctx.globalCompositeOperation = 'source-over';
  }
  if (sd.mode === 'fight' && sd.fireT < 18) {              // 활시위를 당기는 중: 뱃머리에 불씨가 켜진다
    ctx.globalCompositeOperation = 'lighter';
    glow(sd.x + Math.sin(sd.face) * 30, sd.y - Math.cos(sd.face) * 30, 10 + (18 - sd.fireT) * 0.5, 'rgba(255, 120, 60, 0.6)');
    ctx.globalCompositeOperation = 'source-over';
  }
  // 남은 내구도 (작은 점)
  for (let i = 0; i < sd.hp; i++) {
    ctx.fillStyle = '#ffcf70';
    ctx.beginPath();
    ctx.arc(sd.x - (sd.hp - 1) * 4 + i * 8, sd.y - 42, 2, 0, TAU);
    ctx.fill();
  }
}

function drawSuitorArrows() {
  for (const f of suitorArrows) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.ang);
    ctx.strokeStyle = '#6b3a2a';                             // 검붉은 화살대
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 15); ctx.stroke();
    ctx.fillStyle = '#ff6a3d';
    ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(-2.5, 1); ctx.lineTo(2.5, 1); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    glow(0, -1, 10, 'rgba(255, 80, 40, 0.7)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }
}

// --- 이타카의 도끼: 물 위에 떠 있는 받침대에 꽂힌 도끼. 도끼날의 고리를 꿰뚫어라 ---
function drawAxeShape(scale, lit) {
  ctx.save();
  ctx.scale(scale, scale);
  ctx.strokeStyle = '#7a4a22';                              // 자루
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -12); ctx.stroke();
  const g = ctx.createLinearGradient(-12, -16, 12, -4);     // 양날 도끼날
  g.addColorStop(0, lit ? '#fff1b8' : '#8c96a0');
  g.addColorStop(0.5, lit ? '#e9c46a' : '#d7dee4');
  g.addColorStop(1, lit ? '#b8862e' : '#6f7880');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-2, -15);
  ctx.quadraticCurveTo(-8, -18, -13, -21);
  ctx.quadraticCurveTo(-10, -12, -13, -3);
  ctx.quadraticCurveTo(-8, -6, -2, -9);
  ctx.lineTo(2, -9);
  ctx.quadraticCurveTo(8, -6, 13, -3);
  ctx.quadraticCurveTo(10, -12, 13, -21);
  ctx.quadraticCurveTo(8, -18, 2, -15);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1b2a33';                                // 화살이 지나갈 고리 구멍
  ctx.beginPath(); ctx.arc(0, -12, 2.6, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawAxe(ax) {
  const x = ax.x, y = ax.y + Math.sin(ax.bob) * 2;
  ctx.globalCompositeOperation = 'lighter';
  glow(x, y - 8, 26, 'rgba(255, 220, 130, ' + (0.22 + Math.sin(tick * 0.1 + ax.bob) * 0.08) + ')');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0, 20, 30, 0.25)';                  // 물그림자
  ctx.beginPath(); ctx.ellipse(x + 2, y + 11, 13, 4, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#6b4526';                                // 떠 있는 나무 받침
  ctx.fillRect(-10, 7, 20, 5);
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(-10, 7, 20, 2);
  ctx.rotate(ax.spin * Math.sin(ax.bob * 0.5));
  drawAxeShape(1, false);
  ctx.restore();
}

// 화면 위: 맞힌 도끼 표시 (12칸)
function drawAxeTally() {
  const n = SETTINGS.axeCount, gap = 22, x0 = W / 2 - (n - 1) * gap / 2, y = 104;
  ctx.fillStyle = 'rgba(3, 15, 26, 0.55)';
  ctx.fillRect(x0 - 16, y - 16, (n - 1) * gap + 32, 26);
  for (let i = 0; i < n; i++) {
    ctx.save();
    ctx.translate(x0 + i * gap, y + 6);
    ctx.globalAlpha = i < axesHit ? 1 : 0.35;
    drawAxeShape(0.55, i < axesHit);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// --- 불화살 ---
function drawArrows() {
  for (const a0 of arrows) {
    ctx.save();
    ctx.translate(a0.x, a0.y);
    ctx.rotate(a0.ang || 0);
    const a = { x: 0, y: 0 };
    ctx.strokeStyle = '#d9c08c';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x, a.y + 15);
    ctx.stroke();
    ctx.strokeStyle = '#f3ead2';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y + 12);
    ctx.lineTo(a.x - 2.5, a.y + 16);
    ctx.moveTo(a.x, a.y + 12);
    ctx.lineTo(a.x + 2.5, a.y + 16);
    ctx.stroke();
    ctx.fillStyle = '#e0b04f';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - 5);
    ctx.lineTo(a.x - 2.5, a.y + 1);
    ctx.lineTo(a.x + 2.5, a.y + 1);
    ctx.closePath();
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    glow(a.x, a.y - 1, 9, 'rgba(255, 150, 50, 0.65)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }
}

// --- 망령의 푸른 불꽃 ---
function drawGhostFire() {
  for (const f of ghostFire) {
    ctx.globalCompositeOperation = 'lighter';
    glow(f.x, f.y, 15, 'rgba(90, 255, 160, 0.55)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#d8ffe8';
    ctx.beginPath();
    ctx.arc(f.x, f.y, 3 + Math.random(), 0, TAU);
    ctx.fill();
  }
}

// --- 암석 ---
function rockPath(shape, r) {
  ctx.beginPath();
  for (let i = 0; i < shape.length; i++) {
    const a = (i / shape.length) * TAU;
    const rr = r * shape[i];
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0, 15, 25, 0.25)';                  // 물에 비친 그림자 (흰 테두리 대신)
  rockPath(r.shape, r.r * 1.08 + 2);
  ctx.fill();
  rockPath(r.shape, r.r);
  const g = ctx.createRadialGradient(-r.r * 0.35, -r.r * 0.35, r.r * 0.1, 0, 0, r.r * 1.1);
  g.addColorStop(0, '#9aa3a8');
  g.addColorStop(1, '#2f3539');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(70, 120, 80, 0.6)';
  for (const a of r.algae) {
    ctx.beginPath();
    ctx.arc(a.x * r.r, a.y * r.r, r.r * 0.22, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

// --- 작은 섬 (거인족의 섬은 바위 절벽이 둘러싼다) ---
function drawIsle(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  const r = o.r;
  ctx.fillStyle = 'rgba(0, 15, 25, 0.25)';                  // 물에 비친 그림자 (흰 테두리 대신)
  rockPath(o.shape, r * 1.05 + 2);
  ctx.fill();
  rockPath(o.shape, r);
  ctx.fillStyle = o.cliff ? '#6b6258' : '#dcc690';         // 모래사장 또는 바위 절벽
  ctx.fill();
  if (o.cliff) {
    ctx.strokeStyle = 'rgba(30, 25, 20, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  rockPath(o.shape, r * (o.cliff ? 0.8 : 0.78));
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
