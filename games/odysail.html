  g.addColorStop(0, o.cliff ? '#6f8f52' : '#86b567');
  g.addColorStop(1, o.cliff ? '#3e5a33' : '#4b7a3f');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.fillStyle = 'rgba(40, 70, 35, 0.5)';                 // 언덕
  ctx.beginPath();
  ctx.ellipse(o.hill.x * r, o.hill.y * r, r * 0.35, r * 0.25, 0.4, 0, TAU);
  ctx.fill();
  for (const t of o.trees) {                               // 올리브 나무
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.beginPath();
    ctx.arc(t.x + 1.5, t.y + 1.5, 4.5 * t.s, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3f6e35';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 4.5 * t.s, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(160, 200, 120, 0.5)';
    ctx.beginPath();
    ctx.arc(t.x - 1.2, t.y - 1.2, 1.8 * t.s, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  if (o.giant) drawGiant(o);
}

// --- 라이스트리고네스의 거인 (위에서 내려다본 모습, 은빛 갑옷) + 창 ---
function drawGiant(o) {
  const g = o.giant;
  const p = giantPos(o);
  ctx.save();
  ctx.translate(p.x, p.y);

  // 그림자
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath();
  ctx.ellipse(3, 4, 22, 14, 0, 0, TAU);
  ctx.fill();

  // 창 (겨눌 때는 뒤로 젖혔다가 던진다)
  const pull = g.mode === 'windup' ? Math.min(1, g.t / 20) * 10 : 0;
  ctx.save();
  ctx.rotate(g.aim);
  ctx.translate(-pull, 0);
  drawSpearShape(0, 0, 0, 1);
  ctx.restore();

  // 팔 (갑옷 팔뚝)
  ctx.strokeStyle = '#8d98a3';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(Math.cos(g.aim + 1.2) * 12, Math.sin(g.aim + 1.2) * 12);
  ctx.lineTo(Math.cos(g.aim) * (10 - pull), Math.sin(g.aim) * (10 - pull));
  ctx.stroke();
  ctx.lineCap = 'butt';

  // 은빛 갑옷 몸통과 어깨 보호대
  const body = ctx.createRadialGradient(-6, -5, 2, 0, 0, 22);
  body.addColorStop(0, '#f2f5f8');
  body.addColorStop(0.45, '#aeb8c2');
  body.addColorStop(1, '#5a6570');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 20, 12, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(30, 40, 50, 0.6)';
  ctx.lineWidth = 1;
  ctx.stroke();
  for (const side of [-1, 1]) {                            // 어깨 보호대
    ctx.fillStyle = '#c9d2da';
    ctx.beginPath();
    ctx.ellipse(side * 14, 0, 6.5, 8.5, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(30, 40, 50, 0.5)';
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(60, 70, 80, 0.45)';              // 갑옷 판 이음새
  ctx.beginPath();
  ctx.moveTo(-8, -10); ctx.lineTo(-8, 10);
  ctx.moveTo(8, -10); ctx.lineTo(8, 10);
  ctx.stroke();

  // 투구 (붉은 깃털 장식)
  const hg = ctx.createRadialGradient(-2, -2, 1, 0, 0, 9);
  hg.addColorStop(0, '#ffffff');
  hg.addColorStop(0.5, '#b9c3cc');
  hg.addColorStop(1, '#66717c');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(0, 0, 8.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#b0302a';
  ctx.beginPath();
  ctx.ellipse(-g.dir * 1, 0, 2.2, 8.5, 0, 0, TAU);
  ctx.fill();
  if (g.mode === 'windup') {                                // 던지기 직전 눈이 붉게 번쩍
    ctx.fillStyle = '#ff5a3a';
    ctx.beginPath(); ctx.arc(Math.cos(g.aim) * 6 - 1.5, Math.sin(g.aim) * 6, 1.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(Math.cos(g.aim) * 6 + 1.5, Math.sin(g.aim) * 6, 1.2, 0, TAU); ctx.fill();
  }
  if (g.flash > 0) {                                        // 불화살에 맞았을 때
    ctx.globalCompositeOperation = 'lighter';
    glow(0, 0, 26, 'rgba(255, 200, 140, 0.6)');
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  // 체력 표시 (작은 칸)
  for (let i = 0; i < SETTINGS.giantHp; i++) {
    ctx.fillStyle = i < g.hp ? '#e9eef2' : 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(p.x - 10 + i * 7, p.y - 22, 5, 3);
  }
}

// 창 모양: (x, y)에서 오른쪽(+x)을 향해 그린다
function drawSpearShape(x, y, angle, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(s, s);
  ctx.strokeStyle = '#8a6440';                              // 나무 자루
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, 0);
  ctx.lineTo(24, 0);
  ctx.stroke();
  const tg = ctx.createLinearGradient(24, -3, 24, 3);       // 은빛 창날
  tg.addColorStop(0, '#ffffff');
  tg.addColorStop(1, '#8e99a4');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(22, -3);
  ctx.lineTo(34, 0);
  ctx.lineTo(22, 3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// --- 날아오는 것들 그리기 ---
function drawMissiles() {
  for (const m of missiles) {
    if (m.type === 'boulder') drawFlyingBoulder(m);
    else if (m.type === 'spear') {
      const a = Math.atan2(m.vy, m.vx);
      ctx.strokeStyle = 'rgba(220, 235, 245, 0.25)';        // 공기를 가르는 잔상
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x - Math.cos(a) * 30, m.y - Math.sin(a) * 30);
      ctx.lineTo(m.x - Math.cos(a) * 60, m.y - Math.sin(a) * 60);
      ctx.stroke();
      drawSpearShape(m.x - Math.cos(a) * 34, m.y - Math.sin(a) * 34, a, 1);
    } else if (m.type === 'food') drawFood(m);
    else if (m.type === 'zap') drawZap(m);
  }
}

// --- 사방에서 날아오는 벼락 ---
function drawZap(m) {
  ctx.globalCompositeOperation = 'lighter';
  if (m.wait > 0) {                                        // 모이는 중: 번쩍이는 전기 덩어리
    const k = 1 - m.wait / 40;
    glow(m.x, m.y, 14 + k * 14, 'rgba(160, 200, 255, ' + (0.35 + 0.4 * k) + ')');
    ctx.strokeStyle = 'rgba(230, 240, 255, ' + (0.5 + 0.5 * k) + ')';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * TAU, r = 6 + k * 12;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x + Math.cos(a) * r * 0.5 + rand(-3, 3), m.y + Math.sin(a) * r * 0.5 + rand(-3, 3));
      ctx.lineTo(m.x + Math.cos(a) * r, m.y + Math.sin(a) * r);
      ctx.stroke();
    }
  } else {                                                 // 날아가는 중: 지그재그 번개 꼬리
    const a = Math.atan2(m.vy, m.vx);
    const ca = Math.cos(a), sa = Math.sin(a);
    const pts = [];
    for (let i = 0; i <= 6; i++) {
      const back = i * 7, off = i === 0 ? 0 : rand(-5, 5);
      pts.push({ x: m.x - ca * back - sa * off, y: m.y - sa * back + ca * off });
    }
    for (const [w, c] of [[7, 'rgba(120, 170, 255, 0.35)'], [2.5, 'rgba(235, 245, 255, 0.95)']]) {
      ctx.strokeStyle = c;
      ctx.lineWidth = w;
      ctx.beginPath();
      pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
      ctx.stroke();
    }
    glow(m.x, m.y, 16, 'rgba(190, 215, 255, 0.6)');
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFlyingBoulder(m) {
  ctx.fillStyle = 'rgba(0, 10, 20, 0.25)';                  // 바다 위 그림자
  ctx.beginPath();
  ctx.ellipse(m.x + m.r * 0.5, m.y + m.r * 0.9, m.r, m.r * 0.6, 0, 0, TAU);
  ctx.fill();
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.spin);
  rockPath(m.shape, m.r);
  const g = ctx.createRadialGradient(-m.r * 0.3, -m.r * 0.3, 1, 0, 0, m.r * 1.1);
  g.addColorStop(0, '#b6aea3');
  g.addColorStop(1, '#4a443d');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';                    // 패인 자국
  ctx.beginPath();
  ctx.arc(m.r * 0.25, m.r * 0.15, m.r * 0.2, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// --- 키르케의 마법 음식 (보랏빛 마력이 감돈다) ---
function drawFood(m) {
  ctx.globalCompositeOperation = 'lighter';
  glow(m.x, m.y, 16, 'rgba(180, 100, 255, 0.35)');
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.spin);
  if (m.food === 'bread') {                                 // 빵
    ctx.fillStyle = '#c98a45';
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 6.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a5524';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const cx of [-4, 0, 4]) { ctx.moveTo(cx - 1.5, -3); ctx.lineTo(cx + 1.5, 3); }
    ctx.stroke();
  } else if (m.food === 'meat') {                           // 고기
    ctx.fillStyle = '#f1e6d2';
    ctx.fillRect(4, -1.5, 7, 3);
    ctx.beginPath(); ctx.arc(11, -2, 2, 0, TAU); ctx.arc(11, 2, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#9c3f2a';
    ctx.beginPath(); ctx.ellipse(-2, 0, 8, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255, 200, 150, 0.35)';
    ctx.beginPath(); ctx.ellipse(-4, -2, 3, 2, 0, 0, TAU); ctx.fill();
  } else if (m.food === 'grapes') {                         // 포도
    ctx.fillStyle = '#6a3a8f';
    for (const [gx, gy] of [[-4, -3], [0, -3], [4, -3], [-2, 1], [2, 1], [0, 5]]) {
      ctx.beginPath(); ctx.arc(gx, gy, 2.8, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#4f8a3a';
    ctx.fillRect(-1, -9, 2, 4);
  } else if (m.food === 'cheese') {                         // 치즈
    ctx.fillStyle = '#f2c94c';
    ctx.beginPath(); ctx.moveTo(-9, 6); ctx.lineTo(9, 6); ctx.lineTo(4, -6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d9a92e';
    ctx.beginPath(); ctx.arc(1, 2, 1.6, 0, TAU); ctx.arc(-3, 4, 1.2, 0, TAU); ctx.fill();
  } else {                                                   // 포도주 잔
    ctx.fillStyle = '#c9a24c';
    ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, -6); ctx.lineTo(3, 1); ctx.lineTo(-3, 1); ctx.closePath(); ctx.fill();
    ctx.fillRect(-1, 1, 2, 5);
    ctx.fillRect(-4, 6, 8, 1.6);
    ctx.fillStyle = '#7a1f3a';
    ctx.beginPath(); ctx.ellipse(0, -5.5, 6, 1.6, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// --- 하늘색 해독 물약 (게임에서 흔히 보는 둥근 물약병) ---
function drawPotion(p) {
  const x = p.x, y = p.y + Math.sin(p.bob) * 2;
  ctx.globalCompositeOperation = 'lighter';
  glow(x, y, 22, 'rgba(110, 210, 255, 0.3)');
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0, 20, 30, 0.25)';                  // 물에 비친 그림자
  ctx.beginPath();
  ctx.ellipse(2, 10, 10, 3.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#9a6a3a';                                // 코르크 마개
  ctx.fillRect(-3, -15, 6, 4);
  ctx.fillStyle = 'rgba(220, 240, 255, 0.85)';              // 유리 목
  ctx.fillRect(-2.5, -11, 5, 5);
  const g = ctx.createRadialGradient(-3, -1, 1, 0, 2, 10);  // 둥근 유리병 속 하늘색 물약
  g.addColorStop(0, '#e6f9ff');
  g.addColorStop(0.35, '#7fd8ff');
  g.addColorStop(1, '#2a8fc4');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 2, 8.5, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(230, 248, 255, 0.9)';             // 유리 테두리
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';              // 반짝이는 하이라이트
  ctx.beginPath();
  ctx.ellipse(-3.5, -1.5, 1.6, 3, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// --- 제우스의 벼락 ---
function drawBoltWarn(b) {
  const k = b.t / b.warn;
  ctx.fillStyle = 'rgba(10, 15, 30, ' + (0.15 + k * 0.3) + ')';   // 먹구름 그림자
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, 36, 24, 0, 0, TAU);
  ctx.fill();
  if (k > 0.6 && Math.floor(b.t / 3) % 2 === 0) {          // 떨어지기 직전 그림자가 짙어지며 번쩍인다 (점선 없음)
    ctx.fillStyle = 'rgba(10, 15, 30, 0.2)';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 30, 20, 0, 0, TAU);
    ctx.fill();
  }
}

function drawBoltStrike(b) {
  const a = 1 - (b.t - b.warn) / 12;
  const pts = [];
  for (let i = 0; i <= 8; i++) pts.push({ x: b.x + b.path[i] * (i < 8 ? 1 : 0), y: -10 + (b.y + 10) * i / 8 });
  ctx.globalCompositeOperation = 'lighter';
  for (const [w, c] of [[8, 'rgba(120, 170, 255, ' + (0.35 * a) + ')'], [3, 'rgba(230, 240, 255, ' + a + ')']]) {
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.beginPath();
    pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
    ctx.stroke();
  }
  glow(b.x, b.y, 40, 'rgba(200, 220, 255, ' + (0.6 * a) + ')');
  ctx.globalCompositeOperation = 'source-over';
}

// --- 칼립소의 태풍 ---
function drawTyphoon(t) {
  // 원래 크기로 그린 뒤 줄여서 배의 2배 크기로 맞춘다
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.scale(0.42, 0.42);
  const c = { x: 0, y: 0, pull: 168, core: 47, rot: t.rot };
  const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.pull);
  g.addColorStop(0, 'rgba(40, 50, 65, 0.0)');
  g.addColorStop(0.25, 'rgba(200, 210, 225, 0.55)');
  g.addColorStop(0.55, 'rgba(150, 165, 185, 0.35)');
  g.addColorStop(1, 'rgba(120, 140, 160, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.pull, 0, TAU);
  ctx.fill();
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {                            // 소용돌이치는 구름 띠
    const r = c.core * 0.7 + i * 14;
    const start = -c.rot * (1.5 - i * 0.1) + i * 0.9;
    ctx.strokeStyle = 'rgba(240, 245, 255, ' + (0.55 - i * 0.05) + ')';
    ctx.lineWidth = 7 - i * 0.6;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, start, start + Math.PI * 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, start + Math.PI, start + Math.PI * 1.7);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.fillStyle = 'rgba(20, 40, 70, 0.85)';                // 태풍의 눈
  ctx.beginPath();
  ctx.arc(c.x, c.y, 14, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 120, 90, 0.5)';             // 휩쓸리는 경계
  ctx.setLineDash([6, 6]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.core, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// --- 촉수 괴물 ---
function drawTentacleWarn(t) {
  // 솟아오르기 전: 물 밑에서 어두운 그림자가 꿈틀거린다
  if (t.phase === 'warn') {
    const k = Math.min(1, t.t / 20);
    ctx.fillStyle = 'rgba(25, 5, 40, ' + (0.4 * k) + ')';
    ctx.beginPath();
    ctx.ellipse(t.x, t.y, 22, 16, 0, 0, TAU);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const r = 8 + ((t.t * 0.7 + i * 8) % 26);
      ctx.strokeStyle = 'rgba(60, 20, 80, ' + (0.5 * (1 - r / 34)) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, TAU);
      ctx.stroke();
    }
  }
}

function drawTentacle(t) {
  const sh = tentacleShape(t);
  if (sh.len <= 0.5) return;
  const ca = Math.cos(t.ang), sa = Math.sin(t.ang);
  const fade = t.phase === 'sink' ? Math.max(0, 1 - t.t / 20) : 1;
  const N = 16;
  const pts = [];
  for (let j = 0; j <= N; j++) {
    const s = j / N;
    const wig = Math.sin(s * 5 + tick * 0.12 + t.sway) * 7 * s * (t.phase === 'lie' ? 0.35 : 1);
    const curl = t.phase === 'rise' ? Math.pow(s, 3) * 16 : 0;       // 치켜든 끝이 말려 있다
    const bx = t.x + ca * sh.len * s - sa * (wig + curl);
    const by = t.y + sa * sh.len * s + ca * (wig + curl);
    const lift = sh.lift * Math.sin(Math.min(1, s * 1.15) * Math.PI / 2);
    pts.push({ x: bx, y: by - lift, gx: bx, gy: by, w: (1 - s) * 11 + 2.5, s });
  }
  ctx.globalAlpha = fade;
  // 물 위에 드리운 그림자
  ctx.fillStyle = 'rgba(10, 5, 25, 0.28)';
  for (const p of pts) { ctx.beginPath(); ctx.arc(p.gx + 4, p.gy + 4, p.w, 0, TAU); ctx.fill(); }
  // 솟은 자리의 물거품
  ctx.fillStyle = 'rgba(25, 5, 40, 0.35)';
  ctx.beginPath(); ctx.ellipse(t.x, t.y + 2, 18, 9, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(220, 245, 255, ' + (0.35 + 0.15 * Math.sin(tick * 0.2)) + ')';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(t.x, t.y + 2, 20 + Math.sin(tick * 0.15) * 2, 10, 0, 0, TAU); ctx.stroke();
  // 촉수 몸통 (아랫부분은 짙은 자주, 끝으로 갈수록 분홍)
  for (const p of pts) {
    const c = Math.round(91 + p.s * 103), c2 = Math.round(31 + p.s * 59), c3 = Math.round(79 + p.s * 75);
    ctx.fillStyle = 'rgb(' + c + ',' + c2 + ',' + c3 + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.w, 0, TAU);
    ctx.fill();
  }
  // 등쪽 하이라이트
  ctx.fillStyle = 'rgba(255, 210, 235, 0.25)';
  for (let j = 0; j < pts.length; j += 2) {
    const p = pts[j];
    ctx.beginPath(); ctx.arc(p.x - p.w * 0.3, p.y - p.w * 0.3, p.w * 0.45, 0, TAU); ctx.fill();
  }
  // 빨판
  ctx.fillStyle = '#f3c6d8';
  for (let j = 1; j < pts.length - 1; j += 2) {
    const p = pts[j];
    ctx.beginPath();
    ctx.arc(p.x + sa * p.w * 0.5, p.y - ca * p.w * 0.5, p.w * 0.28, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#b8678f';
    ctx.beginPath();
    ctx.arc(p.x + sa * p.w * 0.5, p.y - ca * p.w * 0.5, p.w * 0.12, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#f3c6d8';
  }
  ctx.globalAlpha = 1;
  if (t.flash > 0) {
    const m = pts[Math.floor(N / 2)];
    ctx.globalCompositeOperation = 'lighter';
    glow(m.x, m.y, 30, 'rgba(255, 220, 240, 0.6)');
    ctx.globalCompositeOperation = 'source-over';
  }
}

// --- 소용돌이 (카리브디스) ---
// 위에서 내려다본 깔때기: 바깥에서 안쪽으로 갈수록 수면이 깊게 꺼지고(가운데가 살짝 아래로 치우쳐 보이게),
// 거품 줄기가 나선을 그리며 점점 빨라지다 시커먼 구멍으로 사라진다
function whirlOff(w, r) {                                  // 깊이감: 안쪽 고리일수록 아래쪽으로 조금 밀려 보인다
  const depth = 1 - r / w.R;
  return { x: w.x + depth * 4, y: w.y + depth * 10 };
}

function drawWhirl(w) {
  // 1) 바깥에서 안쪽으로 점점 짙어지는 물의 고리 (깔때기 벽)
  const RINGS = 14;
  for (let i = 0; i < RINGS; i++) {
    const r = w.R * (1 - i / RINGS) + 2;
    const o = whirlOff(w, r);
    const t = i / RINGS;
    const cr = Math.round(18 - t * 16), cg = Math.round(78 - t * 68), cb = Math.round(108 - t * 88);
    ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (i === 0 ? 0.25 : 0.55 + t * 0.4) + ')';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y, r, r * 0.96, 0, 0, TAU);
    ctx.fill();
  }
  // 2) 깔때기 벽의 빛과 그림자 (위쪽 벽은 햇빛을 받아 밝고, 아래쪽 벽은 어둡다)
  ctx.save();
  ctx.beginPath();
  ctx.arc(w.x, w.y, w.R * 0.75, 0, TAU);
  ctx.clip();
  const lg = ctx.createLinearGradient(w.x, w.y - w.R * 0.75, w.x, w.y + w.R * 0.75);
  lg.addColorStop(0, 'rgba(120, 200, 220, 0)');
  lg.addColorStop(0.35, 'rgba(110, 190, 215, 0.22)');
  lg.addColorStop(0.55, 'rgba(0, 0, 0, 0)');
  lg.addColorStop(1, 'rgba(0, 5, 15, 0.35)');
  ctx.fillStyle = lg;
  ctx.fillRect(w.x - w.R, w.y - w.R, w.R * 2, w.R * 2);
  ctx.restore();

  // 3) 소용돌이치는 물살 줄기 (나선으로 휘어지며 안쪽으로)
  ctx.lineCap = 'round';
  for (const st of w.streaks) {
    const fadeIn = Math.min(1, (w.R - st.r) / 25), fadeOut = Math.min(1, (st.r - w.core) / 25);
    const al = st.al * fadeIn * fadeOut;
    if (al <= 0.02) continue;
    const span = st.len * (0.5 + 30 / (st.r + 20));
    ctx.strokeStyle = 'rgba(225, 248, 255, ' + al + ')';
    ctx.lineWidth = st.w * (0.5 + st.r / w.R);
    ctx.beginPath();
    for (let j = 0; j <= 8; j++) {
      const f = j / 8;
      const a = st.a - span * f;                           // 꼬리 쪽은 조금 더 바깥 → 나선
      const r = st.r * (1 + 0.12 * f);
      const o = whirlOff(w, r);
      const x = o.x + Math.cos(a) * r, y = o.y + Math.sin(a) * r * 0.96;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // 4) 굵은 나선 물마루 4줄기
  for (let i = 0; i < 4; i++) {
    const base = i * TAU / 4 + w.rot * 1.6;
    let prev = null;
    for (let j = 0; j <= 30; j++) {
      const f = j / 30;
      const r = w.R * (0.9 - f * 0.78);
      const a = base + Math.log(w.R / r) * 2.6;
      const o = whirlOff(w, r);
      const pt = { x: o.x + Math.cos(a) * r, y: o.y + Math.sin(a) * r * 0.96 };
      if (prev) {
        ctx.strokeStyle = 'rgba(200, 240, 250, ' + (0.5 * Math.sin(f * Math.PI)) + ')';
        ctx.lineWidth = 1 + 4 * (1 - f);
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
      }
      prev = pt;
    }
  }
  // 5) 가장자리의 하얀 거품 띠 (일렁이며 돈다)
  for (let i = 0; i < 56; i++) {
    const a = i * TAU / 56 + w.rot * 0.5;
    const r = w.R * (0.86 + 0.06 * Math.sin(i * 1.9 + tick * 0.08));
    ctx.fillStyle = 'rgba(240, 252, 255, ' + (0.35 + 0.3 * Math.sin(i * 3.1 + tick * 0.1)) + ')';
    ctx.beginPath();
    ctx.arc(w.x + Math.cos(a) * r, w.y + Math.sin(a) * r * 0.96, 1 + (i % 3) * 0.8, 0, TAU);
    ctx.fill();
  }
  ctx.lineCap = 'butt';
  // 6) 빨려 들어가는 난파선 잔해 (안쪽으로 갈수록 작아지며 깊이 가라앉는다)
  for (const b of w.debris) {
    const o = whirlOff(w, b.r);
    const x = o.x + Math.cos(b.a) * b.r, y = o.y + Math.sin(b.a) * b.r * 0.96;
    const sc = Math.max(0.2, Math.min(1, (b.r - w.core) / 50));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.a + Math.PI / 2);
    ctx.globalAlpha = 0.3 + 0.65 * sc;
    if (b.kind === 0) { ctx.fillStyle = '#7a4f2a'; ctx.fillRect(-8 * sc, -2 * sc, 16 * sc, 4 * sc); }
    else if (b.kind === 1) { ctx.fillStyle = '#5c3b20'; ctx.beginPath(); ctx.arc(0, 0, 4.5 * sc, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = '#a8743f'; ctx.lineWidth = 2 * sc; ctx.beginPath(); ctx.moveTo(0, -8 * sc); ctx.lineTo(0, 8 * sc); ctx.stroke(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 7) 바닥 모를 구멍과, 그 둘레에 피어오르는 물안개
  const o = whirlOff(w, w.core);
  const hg = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, w.core + 12);
  hg.addColorStop(0, 'rgba(0, 0, 0, 1)');
  hg.addColorStop(0.6, 'rgba(0, 4, 10, 0.95)');
  hg.addColorStop(1, 'rgba(0, 10, 20, 0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(o.x, o.y, w.core + 12, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const a = -w.rot * 3 + i * TAU / 6;
    glow(o.x + Math.cos(a) * (w.core + 5), o.y + Math.sin(a) * (w.core + 5), 7, 'rgba(120, 200, 220, 0.25)');
  }
  ctx.globalCompositeOperation = 'source-over';
}

// --- 세이렌 ---
function drawSirenArea(s) {
  // 영역 표시는 없다. 노래가 들릴 때만 세이렌 주변이 분홍빛으로 빛난다
  if (song.phase === 'quiet') return;
  const k = song.phase === 'singing' ? 1 : 0.4;
  ctx.globalCompositeOperation = 'lighter';
  glow(s.x, s.y, 90 + Math.sin(tick * 0.1) * 10, 'rgba(255, 110, 190, ' + (0.22 * k) + ')');
  ctx.globalCompositeOperation = 'source-over';
}

const SIREN_ROCK = [1, 0.9, 1.05, 0.95, 0.85, 1, 0.92, 1.04, 0.9, 0.97];
function drawSiren(s) {
  drawRock({ x: s.x, y: s.y, r: 18, shape: SIREN_ROCK, phase: 0, algae: [] });
  const bx = s.x, by = s.y - 4;
  ctx.globalCompositeOperation = 'lighter';
  glow(bx, by - 8, 18, 'rgba(255, 150, 210, 0.45)');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#3fb6a0';
  ctx.beginPath();
  ctx.ellipse(bx + 5, by + 2, 7, 3.5, 0.4, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx + 11, by + 5);
  ctx.lineTo(bx + 16, by + 2);
  ctx.lineTo(bx + 15, by + 9);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f2c9b0';
  ctx.beginPath();
  ctx.ellipse(bx - 2, by - 5, 3.2, 5.5, -0.2, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bx - 3, by - 13, 3.4, 0, TAU);
  ctx.fill();
  const sway = Math.sin(tick * 0.05) * 2;
  ctx.fillStyle = '#e892bf';
  ctx.beginPath();
  ctx.moveTo(bx - 6, by - 15);
  ctx.quadraticCurveTo(bx - 3, by - 19, bx + 1, by - 15);
  ctx.quadraticCurveTo(bx + 6 + sway, by - 8, bx + 3 + sway, by - 1);
  ctx.quadraticCurveTo(bx, by - 8, bx - 1, by - 12);
  ctx.closePath();
  ctx.fill();
}

// --- 트로이 목마 (선체 수리 아이템) ---
function drawHorse(h) {
  const x = h.x, y = h.y + Math.sin(h.bob) * 2;
  ctx.globalCompositeOperation = 'lighter';
  glow(x, y, 24, 'rgba(255, 210, 120, 0.25)');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0, 20, 30, 0.25)';                  // 물에 비친 그림자 (흰 원 대신)
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 11, 13, 4, 0, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  const wood = ['#c98a4b', '#7a4a22'];
  ctx.fillStyle = '#5a3a22';                                // 바퀴 달린 받침대
  ctx.fillRect(-11, 6, 22, 3);
  ctx.fillStyle = '#3b2716';
  for (const wx of [-8, 8]) {
    ctx.beginPath();
    ctx.arc(wx, 10, 2.4, 0, TAU);
    ctx.fill();
  }
  ctx.strokeStyle = wood[1];                                // 다리 네 개
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const lx of [-7, -4, 4, 7]) {
    ctx.moveTo(lx, 1);
    ctx.lineTo(lx, 6);
  }
  ctx.stroke();
  const g = ctx.createLinearGradient(0, -12, 0, 2);
  g.addColorStop(0, wood[0]);
  g.addColorStop(1, wood[1]);
  ctx.fillStyle = g;
  ctx.beginPath();                                          // 몸통
  ctx.ellipse(0, -1, 9, 4.5, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();                                          // 목과 머리
  ctx.moveTo(5, -3);
  ctx.lineTo(8, -12);
  ctx.lineTo(13, -11);
  ctx.lineTo(13, -8);
  ctx.lineTo(10, -8);
  ctx.lineTo(9, -2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = wood[1];                                  // 갈기
  ctx.beginPath();
  ctx.moveTo(7, -4);
  ctx.lineTo(8, -12);
  ctx.lineTo(6, -11);
  ctx.lineTo(5, -4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = wood[1];                                // 꼬리
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -2);
  ctx.quadraticCurveTo(-13, 0, -12, 4);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(40, 20, 5, 0.35)';                // 나무 판자 결
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-7, -2);
  ctx.lineTo(7, -2);
  ctx.moveTo(-6, 1);
  ctx.lineTo(6, 1);
  ctx.stroke();
  ctx.fillStyle = '#111';                                   // 눈
  ctx.beginPath();
  ctx.arc(11, -10, 0.7, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// --- 이타카 섬 ---
function drawIthaca(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 0, 200, 128, 0, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = '#dcc690';
  ctx.beginPath();
  ctx.ellipse(0, 0, 190, 120, 0, 0, TAU);
  ctx.fill();
  const g = ctx.createRadialGradient(-40, -30, 10, 0, 0, 180);
  g.addColorStop(0, '#7fae62');
  g.addColorStop(1, '#4b7a3f');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, -6, 172, 104, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(40, 80, 35, 0.55)';
  ctx.beginPath(); ctx.ellipse(-60, -30, 60, 36, -0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(70, -45, 50, 30, 0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4f7d3a';
  for (const [tx, ty] of [[-120, 10], [-100, 30], [110, 10], [130, -10], [-20, -70], [20, -78]]) {
    ctx.beginPath(); ctx.arc(tx, ty, 6, 0, TAU); ctx.fill();
  }
  for (const [hx, hy] of [[-30, 40], [-10, 46], [12, 38], [30, 50], [0, 20]]) {
    ctx.fillStyle = '#f4efe4';
    ctx.fillRect(hx - 6, hy - 5, 12, 10);
    ctx.fillStyle = '#c0583e';
    ctx.fillRect(hx - 6, hy - 5, 12, 3);
  }
  ctx.strokeStyle = '#8a6a44';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 100);
  ctx.lineTo(0, 132);
  ctx.stroke();
  ctx.restore();
}

// --- 효과 그리기 ---
function drawParticles(layer) {
  for (const p of particles) {
    const below = p.kind === 'foam' || p.kind === 'soul';
    if ((layer === 'below') !== below) continue;
    const k = p.t / p.life;
    if (p.kind === 'foam') {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.45 * (1 - k)) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + p.t * 0.12, 0, TAU);
      ctx.fill();
    } else if (p.kind === 'soul') {                          // 저승에서 떠오르는 넋
      ctx.globalCompositeOperation = 'lighter';
      glow(p.x + Math.sin(p.t * 0.05) * 6, p.y, 6, 'rgba(150, 255, 200, ' + (0.4 * Math.sin(k * Math.PI)) + ')');
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'note') {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = p.color;
      ctx.font = '700 ' + p.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('♪', p.x, p.y);
      ctx.globalAlpha = 1;
    } else if (p.kind === 'spark') {
      ctx.globalAlpha = 1 - k;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }
}

function drawRings() {
  for (const r of rings) {
    if (r.t < 0) continue;
    const k = r.t / r.life;
    if (r.fire) {
      ctx.globalCompositeOperation = 'lighter';
      glow(r.x, r.y, r.r * (0.5 + k), 'rgba(255, 170, 80, ' + (0.7 * (1 - k)) + ')');
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r * (0.3 + k), r.r * (0.3 + k) * 0.7, 0, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function drawPopups() {
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, (55 - p.t) / 20);
    drawText(p.text, p.x, p.y, FONT_KR(14, 700), p.color, 'center', 6);
    ctx.globalAlpha = 1;
  }
}

// --- 태풍에 휩쓸리는 연출 ---
function drawBlown() {
  const k = 1 - blownTimer / 150;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.lineCap = 'round';
  for (let i = 0; i < 10; i++) {
    const r = 40 + i * 30;
    const start = tick * (0.08 + i * 0.01) + i;
    ctx.strokeStyle = 'rgba(235, 240, 250, ' + (0.15 + k * 0.4) + ')';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(0, 0, r, start, start + Math.PI * 0.8);
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(220, 230, 245, ' + Math.max(0, (k - 0.6) * 2.2) + ')';
  ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 170, H / 2 - 50, 340, 96);
  drawText('태풍에 휩쓸렸다!', W / 2, H / 2 - 8, FONT_KR(26, 700), '#ffd07a', 'center', 10);
  drawText(mode === 'easy' ? '칼립소의 섬 처음으로 되돌아간다…' : '모든 것을 잃고 처음 바다로 되돌아간다…', W / 2, H / 2 + 24, FONT_KR(14, 500), '#d6e4ec');
}

// --- 상단 정보판 ---
function drawHUD() {
  const bar = ctx.createLinearGradient(0, 0, 0, 80);
  bar.addColorStop(0, 'rgba(3, 15, 26, 0.9)');
  bar.addColorStop(1, 'rgba(3, 15, 26, 0)');
  ctx.fillStyle = bar;
  ctx.fillRect(0, 0, W, 80);

  drawText('SCORE' + (mode === 'easy' ? '  · 쉬운 버전' : ''), 16, 18, FONT_KR(10, 700), '#8fb6c9', 'left');
  drawText(String(Math.floor(score)).padStart(5, '0'), 16, 39, FONT_EN(19, 700), '#ffffff', 'left');
  drawText('BEST', W / 2, 18, FONT_EN(10, 700), '#8fb6c9');
  drawText(String(Math.max(Math.floor(score), highScore)).padStart(5, '0'), W / 2, 39, FONT_EN(19, 700), '#e9c46a');

  const hp = Math.max(0, player ? player.hull : SETTINGS.hull);
  drawText(poisoned ? 'HULL · 저주 ×' + poisonStack : 'HULL', W - 16, 18, FONT_EN(10, 700), poisoned ? '#d6a6ff' : '#8fb6c9', 'right');
  const bx = W - 116, by = 28, bw = 100, bh = 9;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = poisoned ? '#b77dff' : hp > 60 ? '#7bd389' : hp > 30 ? '#f4c95d' : '#ef6f6c';
  ctx.fillRect(bx, by, bw * hp / SETTINGS.hull, bh);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  // 출발 → 이타카 항해 진행 (해역 경계마다 눈금)
  const p = progress();
  const x0 = 60, x1 = W - 60, y = 56;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.fillRect(x0, y - 1.5, x1 - x0, 3);
  ctx.fillStyle = '#e9c46a';
  ctx.fillRect(x0, y - 1.5, (x1 - x0) * p, 3);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  let acc = 0, total = 0;
  for (let i = 0; i < STAGES.length; i++) total += stageLength(i);
  for (let i = 0; i < STAGES.length - 1; i++) {
    acc += stageLength(i);
    ctx.fillRect(x0 + (x1 - x0) * acc / total - 0.5, y - 4, 1, 8);
  }
  ctx.fillStyle = '#c9a36b';
  ctx.beginPath(); ctx.arc(x0 - 8, y, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7fae62';
  ctx.beginPath(); ctx.arc(x1 + 8, y, 4, 0, TAU); ctx.fill();
  const mx = x0 + (x1 - x0) * p;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(mx + 6, y);
  ctx.lineTo(mx - 3, y - 4);
  ctx.lineTo(mx - 3, y + 4);
  ctx.closePath();
  ctx.fill();
  drawText('트로이', x0 - 8, 74, FONT_KR(9, 500), '#c9a36b');
  drawText('이타카', x1 + 8, 74, FONT_KR(9, 500), '#9fd38a');
  drawText((stage + 1) + '/' + STAGES.length + '  ' + STAGES[stage].name, W / 2, 74, FONT_KR(11, 700), '#d6e9f3');
  if (player && STAGES[stage].event === 'home' && !arriving) drawAxeTally();

  // 부스터 게이지 (왼쪽 아래, 바람 위)
  ctx.fillStyle = 'rgba(3, 15, 26, 0.6)';
  ctx.fillRect(12, H - 68, 96, 26);
  drawText('부스터', 34, H - 51, FONT_KR(11, 700), boosting ? '#ffe7a3' : '#bcd7e6');
  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.fillRect(58, H - 60, 44, 8);
  ctx.fillStyle = boosting ? '#ffd27a' : boost > 15 ? '#8fe3ff' : '#6b7c88';
  ctx.fillRect(58, H - 60, 44 * boost / 100, 8);

  // 바람 (왼쪽 아래)
  ctx.fillStyle = 'rgba(3, 15, 26, 0.6)';
  ctx.fillRect(12, H - 38, 96, 26);
  drawText('바람', 30, H - 21, FONT_KR(11, 700), '#bcd7e6');
  const cx = 74, cy = H - 25, len = 6 + Math.min(1.5, Math.abs(windX)) * 18, dir = windX >= 0 ? 1 : -1;
  ctx.strokeStyle = '#e8f6ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - dir * len / 2, cy);
  ctx.lineTo(cx + dir * len / 2, cy);
  ctx.lineTo(cx + dir * len / 2 - dir * 5, cy - 4);
  ctx.moveTo(cx + dir * len / 2, cy);
  ctx.lineTo(cx + dir * len / 2 - dir * 5, cy + 4);
  ctx.stroke();

  // 남은 거리 (오른쪽 아래)
  ctx.fillStyle = 'rgba(3, 15, 26, 0.6)';
  ctx.fillRect(W - 158, H - 38, 146, 26);
  if (STAGES[stage].event === 'home' && !arriving) drawText('남은 도끼 ' + (SETTINGS.axeCount - axesHit) + '개', W - 85, H - 21, FONT_KR(11, 700), '#ffe08a');
  else drawText('이타카까지 ' + leagueText(), W - 85, H - 21, FONT_KR(11, 700), '#bcd7e6');
}

// --- 시작 화면 ---
const MODE_BOX_Y = 372, MODE_BOX_H = 62;

function drawStartScreen() {
  drawShip(W / 2, H - 62 + Math.sin(tick * 0.04) * 4, { tilt: Math.sin(tick * 0.02) * 0.06, oar: tick * 0.12, scale: 1.5 });

  drawText('ODYSSEUS', W / 2, 190, FONT_EN(52, 900), '#f3e6c4', 'center', 18);
  drawText('귀향의 항해', W / 2, 228, FONT_KR(20, 700), '#e9c46a', 'center', 8);
  drawText('트로이 전쟁은 끝났다.', W / 2, 270, FONT_KR(14, 400), '#d6e4ec');
  drawText('신들의 시련이 기다리는 아홉 바다를 건너', W / 2, 292, FONT_KR(14, 400), '#d6e4ec');
  drawText('고향 이타카로 돌아가라!', W / 2, 314, FONT_KR(14, 400), '#d6e4ec');

  // 버전 고르기
  const boxes = [
    { m: 'easy', x: W / 2 - 160, title: '쉬운 버전', sub: '난파해도 그 바다부터 다시', color: '#9ff0b4' },
    { m: 'normal', x: W / 2 + 6, title: '일반 버전', sub: '난파하면 처음 바다부터', color: '#ffd07a' },
  ];
  for (const bx of boxes) {
    const on = mode === bx.m;
    const r = 10, x = bx.x, y = MODE_BOX_Y, w = 154, h = MODE_BOX_H;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = on ? 'rgba(10, 34, 50, 0.92)' : 'rgba(6, 20, 32, 0.6)';
    ctx.fill();
    ctx.strokeStyle = on ? bx.color : 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.stroke();
    ctx.globalAlpha = on ? 1 : 0.45;
    drawText((on ? '▶ ' : '') + bx.title, x + w / 2, y + 26, FONT_KR(16, 700), bx.color);
    drawText(bx.sub, x + w / 2, y + 47, FONT_KR(11, 500), '#d6e4ec');
    ctx.globalAlpha = 1;
  }
  drawText(isTouch ? '상자를 터치해 버전 고르기' : '← →  버전 고르기', W / 2, MODE_BOX_Y + MODE_BOX_H + 18, FONT_KR(11, 500), '#8fb6c9');
  blinkText(isTouch ? '빈 곳을 터치해 출항' : 'PRESS SPACE TO SET SAIL', MODE_BOX_Y + MODE_BOX_H + 44);
  drawText('BEST (' + (mode === 'easy' ? '쉬운' : '일반') + ')  ' + String(highScore).padStart(5, '0'), W / 2, MODE_BOX_Y + MODE_BOX_H + 68, FONT_KR(12, 700), '#e9c46a');
}

// --- 귀환 성공 화면 ---
function drawVictoryScreen() {
  drawIthaca(W / 2, 220, 1);
  drawShip(W / 2, 400 + Math.sin(tick * 0.05) * 3, { oar: tick * 0.12, scale: 1.3 });
  drawText('HOME AT LAST', W / 2, 478, FONT_EN(30, 900), '#ffe7a3', 'center', 16);
  drawText('이타카 귀환 성공!', W / 2, 512, FONT_KR(20, 700), '#ffffff');
  drawText('SCORE  ' + Math.floor(score) + '     BEST  ' + highScore, W / 2, 546, FONT_EN(14, 700), '#e9c46a');
  drawText(mode === 'easy' ? '쉬운 버전' : '일반 버전', W / 2, 568, FONT_KR(12, 700), mode === 'easy' ? '#9ff0b4' : '#ffd07a');
  blinkText(isTouch ? '화면을 터치해 다시 출항' : 'PRESS SPACE TO SAIL AGAIN', 596);
  drawText(isTouch ? '[ 여기를 터치: 버전 다시 고르기 ]' : 'M  버전 다시 고르기', W / 2, 620, FONT_KR(11, 500), '#8fb6c9');
}

// --- 글자와 패널 도우미 ---
function drawText(text, x, y, font, color, align = 'center', glowSize = 0) {
  ctx.font = font;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  if (glowSize > 0) {
    ctx.shadowColor = color;
    ctx.shadowBlur = glowSize;
  }
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
}

function blinkText(text, y) {
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tick * 0.08);
  drawText(text, W / 2, y, /[가-힣]/.test(text) ? FONT_KR(14, 700) : FONT_EN(14, 700), '#ffffff', 'center', 8);
  ctx.globalAlpha = 1;
}

function dimScreen() {
  ctx.fillStyle = 'rgba(2, 10, 18, 0.6)';
  ctx.fillRect(0, 0, W, H);
}

function panel(x, y, w, h) {
  const r = 12;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(6, 20, 32, 0.88)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(233, 196, 106, 0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
}


// ⑦ 반복
// 한 번의 계산(1/60초 분량)
function step() {
  if (state !== 'paused') {
    tick++;
    for (const w of waves) {
      w.y += SETTINGS.sailSpeed;
      w.x += windX * 0.3;
      if (w.y > H + 10) { w.y = -10; w.x = rand(0, W); }
      if (w.x < -15) w.x = W + 15;
      if (w.x > W + 15) w.x = -15;
    }
    for (const g of glitters) {
      g.y += SETTINGS.sailSpeed;
      if (g.y > H) { g.y = 0; g.x = rand(0, W); }
    }
    shake *= 0.88;
    if (redFlash > 0) redFlash--;
    if (whiteFlash > 0) whiteFlash--;
    updateEffects();
  }
  if (state === 'playing') update();
  if (state === 'blown') {
    blownTimer--;
    if (blownTimer <= 0) {
      if (mode === 'easy') {                               // 쉬운 버전: 칼립소의 섬 처음으로
        startGame(stage);
        bannerNote = '태풍에 휩쓸려 이 바다의 처음으로 되돌아왔다…';
      } else {
        startGame(0);                                      // 일반 버전: 점수도 0, 첫 해역부터 다시
        bannerNote = '태풍에 휩쓸려 처음 바다로 되돌아왔다…';
      }
    }
  }
}

// ⑦ 반복 — 화면이 1초에 몇 번 그려지든(60Hz 모니터, 120Hz 휴대폰…) 게임 계산은 항상 1초에 60번.
//    휴대폰(터치 화면)은 touchGameSpeed만큼 느리게 흐른다 (0.75면 1초에 45번 계산 → 모든 것이 컴퓨터의 0.75배 속도)
loadResume();
let lastTime = null, timeAcc = 0;
function loop(ts) {
  if (lastTime === null) lastTime = ts;
  timeAcc += Math.min(ts - lastTime, 250);                 // 다른 탭에 다녀와도 한꺼번에 몰아서 계산하지 않게
  lastTime = ts;
  const stepMs = 1000 / (60 * (isTouch ? SETTINGS.touchGameSpeed : 1));
  let n = 0;
  while (timeAcc >= stepMs && n < 6) { step(); timeAcc -= stepMs; n++; }
  if (n === 6) timeAcc = 0;
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
